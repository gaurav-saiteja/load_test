          # -------------------------------------------------------------------------
          cat << 'EOF_UNZIP' > sparse_unzip.py
          import os
          import sys
          import time
          import ctypes
          import shutil
          import zipfile

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          WORKSPACE_DIR = "workspace"
          MB = 1024 * 1024
          GB = 1024 * MB
          READ_CHUNK = 16 * MB
          PUNCH_STEP = 128 * MB
          SAFETY_LAG = 32 * MB

          FALLOC_FL_KEEP_SIZE = 0x01
          FALLOC_FL_PUNCH_HOLE = 0x02
          PUNCH_MODE = FALLOC_FL_KEEP_SIZE | FALLOC_FL_PUNCH_HOLE

          try:
              _libc = ctypes.CDLL("libc.so.6", use_errno=True)
              _fallocate64 = getattr(_libc, "fallocate64", getattr(_libc, "fallocate"))
              _fallocate64.argtypes = [ctypes.c_int, ctypes.c_int, ctypes.c_int64, ctypes.c_int64]
              _fallocate64.restype = ctypes.c_int

              def linux_fallocate(fd: int, mode: int, offset: int, length: int):
                  res = _fallocate64(fd, mode, offset, length)
                  if res != 0:
                      err = ctypes.get_errno()
                      raise OSError(err, os.strerror(err) if err else "fallocate64 failed")
          except Exception:
              linux_fallocate = None

          zip_files = [
              os.path.join(root, f)
              for root, _, files in os.walk(WORKSPACE_DIR)
              for f in files
              if f.lower().endswith(".zip")
          ]

          for zip_path in zip_files:
              zip_size = os.path.getsize(zip_path)
              free_start = shutil.disk_usage(WORKSPACE_DIR).free
              print(f"📦 In-Place Sparse Extracting ZIP: {os.path.basename(zip_path)} ({zip_size / GB:.2f} GiB) | Free Disk: {free_start / GB:.2f} GiB")
              t0 = time.perf_counter()

              try:
                  punch_fd = os.open(zip_path, os.O_RDWR)
              except OSError:
                  punch_fd = None

              try:
                  with zipfile.ZipFile(zip_path, "r") as zf:
                      # Sort archive members from the end of the .zip backwards toward offset 0.
                      # As each episode finishes extracting, we immediately ftruncate() the .zip tail
                      # AND punch 128 MiB sparse holes in-flight during extraction.
                      members = [info for info in zf.infolist() if not info.is_dir()]
                      members.sort(key=lambda x: x.header_offset, reverse=True)

                      for idx, zinfo in enumerate(members, 1):
                          base_name = os.path.basename(zinfo.filename)
                          if not base_name or base_name.startswith("."):
                              continue

                          # Guarantee unique flat output path inside workspace/
                          out_path = os.path.join(WORKSPACE_DIR, base_name)
                          if os.path.exists(out_path) and os.path.realpath(out_path) != os.path.realpath(zip_path):
                              stem, ext = os.path.splitext(base_name)
                              out_path = os.path.join(WORKSPACE_DIR, f"{stem}_{idx}{ext}")

                          punched_up_to = (zinfo.header_offset // MB) * MB

                          with zf.open(zinfo, "r") as src, open(out_path, "wb") as dst:
                              shared_f = getattr(src, "_fileobj", None)
                              while True:
                                  buf = src.read(READ_CHUNK)
                                  if not buf:
                                      break
                                  dst.write(buf)

                                  if punch_fd is not None and linux_fallocate is not None and shared_f is not None:
                                      try:
                                          cur_zip_pos = shared_f.tell()
                                          safe_limit = ((cur_zip_pos - SAFETY_LAG) // MB) * MB
                                          if safe_limit - punched_up_to >= PUNCH_STEP:
                                              linux_fallocate(punch_fd, PUNCH_MODE, punched_up_to, safe_limit - punched_up_to)
                                              punched_up_to = safe_limit
                                      except Exception:
                                          pass

                          # All bytes from zinfo.header_offset to EOF have now been extracted; truncate tail immediately
                          if punch_fd is not None:
                              try:
                                  os.ftruncate(punch_fd, zinfo.header_offset)
                              except OSError:
                                  pass

                          free_now = shutil.disk_usage(WORKSPACE_DIR).free
                          print(
                              f"  ✅ [{idx}/{len(members)}] Extracted '{base_name}' ({zinfo.file_size / GB:.2f} GiB) | "
                              f"Free Disk: {free_now / GB:.2f} GiB"
                          )
              finally:
                  if punch_fd is not None:
                      try:
                          os.close(punch_fd)
                      except OSError:
                          pass

              try:
                  os.remove(zip_path)
              except OSError:
                  pass

              elapsed = max(0.001, time.perf_counter() - t0)
              free_end = shutil.disk_usage(WORKSPACE_DIR).free
              print(f"⚡ Sparse ZIP extraction finished in {elapsed:.1f}s | Free Disk: {free_end / GB:.2f} GiB")
          EOF_UNZIP

          python3 -u sparse_unzip.py
          rm -f sparse_unzip.py

          # Extract RAR archives if present
          while read -u 9 RAR; do
            echo "📦 Extracting RAR: $RAR"
            unrar e -y -idq "$RAR" workspace/ || true
            DIR=$(dirname "$RAR")
            rm -f "$DIR"/*.rar "$DIR"/*.r[0-9][0-9] "$DIR"/*.sfv "$DIR"/*.nfo
          done 9< <(find workspace -type f -name "*.rar")

      - name: Strip Audio and Subtitle Track Bloat
        if: env.found == 'true'
        run: |
          cat << 'EOF_BLOAT' > strip_bloat.py
          import os
          import sys
          import re
          import json
          import time
          import ctypes
          import shutil
          import subprocess
          from collections import deque
          from concurrent.futures import ThreadPoolExecutor

          # Guarantee real-time live streaming logs in GitHub Actions
          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          WORKSPACE_DIR = "workspace"
          MB = 1024 * 1024
          GB = 1024 * MB

          # Bind directly to glibc fallocate64 with 64-bit offsets (supports files > 85 GiB)
          FALLOC_FL_KEEP_SIZE = 0x01
          FALLOC_FL_PUNCH_HOLE = 0x02
          PUNCH_MODE = FALLOC_FL_KEEP_SIZE | FALLOC_FL_PUNCH_HOLE

          try:
              _libc = ctypes.CDLL("libc.so.6", use_errno=True)
              _fallocate64 = getattr(_libc, "fallocate64", getattr(_libc, "fallocate"))
              _fallocate64.argtypes = [ctypes.c_int, ctypes.c_int, ctypes.c_int64, ctypes.c_int64]
              _fallocate64.restype = ctypes.c_int

              def linux_fallocate(fd: int, mode: int, offset: int, length: int):
                  res = _fallocate64(fd, mode, offset, length)
                  if res != 0:
                      err = ctypes.get_errno()
                      raise OSError(err, os.strerror(err) if err else "fallocate64 syscall failed")
          except Exception as e:
              print(f"⚠️ Could not bind libc.fallocate64 ({e})")
              linux_fallocate = None

          # 1. Multi-Episode & Movie Discovery + Natural Chronological Sorting
          VIDEO_EXTS = {".mkv", ".mp4", ".m2ts", ".ts", ".mov", ".avi", ".webm", ".m4v"}
          SAMPLE_RE = re.compile(r"(?i)(?:^|[._\s-])sample(?:[._\s-]|$)")
          EP_SORT_RE = re.compile(r"(?i)\b(?:s(\d{1,4})[._\s-]*)?e(\d{1,4})\b")

          def media_sort_key(path: str):
              name = os.path.basename(path)
              m = EP_SORT_RE.search(name)
              s_num = int(m.group(1)) if (m and m.group(1)) else 0
              e_num = int(m.group(2)) if m else 999999
              nat = [int(t) if t.isdigit() else t.lower() for t in re.split(r"(\d+)", name)]
              return (s_num, e_num, nat)

          all_files = [
              os.path.realpath(os.path.join(root, f))
              for root, _, files in os.walk(WORKSPACE_DIR)
              for f in files
          ]
          if not all_files:
              print("❌ No files found in workspace.")
              sys.exit(1)

          # Identify all legitimate media files (>= 100 MiB video containers, excluding samples)
          video_candidates = [
              f for f in all_files
              if os.path.splitext(f)[1].lower() in VIDEO_EXTS
              and os.path.getsize(f) >= 100 * MB
              and not SAMPLE_RE.search(os.path.basename(f))
          ]

          if not video_candidates:
              # Fallback if payload is a small clip or non-standard extension
              video_candidates = [max(all_files, key=os.path.getsize)]

          target_files = sorted(list(set(video_candidates)), key=media_sort_key)
          target_set = set(target_files)

          removed_extra_bytes = 0
          for fpath in all_files:
              if fpath not in target_set:
                  try:
                      removed_extra_bytes += os.path.getsize(fpath)
                      os.remove(fpath)
                  except OSError:
                      pass

          if removed_extra_bytes > 0:
              print(f"🧹 Purged {removed_extra_bytes / MB:.1f} MiB of ancillary non-media files from workspace.")

          total_Initial_gib = sum(os.path.getsize(f) for f in target_files) / GB
          free_initial_gib = shutil.disk_usage(WORKSPACE_DIR).free / GB
          print(f"🎬 Discovered {len(target_files)} media file(s) ({total_Initial_gib:.2f} GiB total) | Free Disk: {free_initial_gib:.2f} GiB")

          # Language and codec match tables
          ALLOWED_AUDIO_LANGS = {
              "en", "eng", "english",
              "hi", "hin", "hindi",
              "ta", "tam", "tamil",
              "te", "tel", "telugu",
              "ml", "mal", "malayalam",
              "ko", "kor", "korean",
              "ja", "jpn", "japanese",
              "thai", "tha"
          }
          ALLOWED_SUB_LANGS = {"en", "eng", "english"}
          ALLOWED_TEXT_SUB_CODECS = {"subrip", "srt", "ass", "ssa", "mov_text", "webvtt", "text", "ttml"}

          COMMENTARY_RE = re.compile(
              r"\b(commentary|commentaries|director'?s\s*comment|cast\s*comment|crew\s*comment|"
              r"audio\s*description|descriptive\s*audio|visually\s*impaired|sdh\s*audio)\b",
              re.IGNORECASE
          )

          def get_tags(stream: dict) -> dict:
              raw_tags = stream.get("tags") or {}
              return {str(k).lower(): str(v).strip() for k, v in raw_tags.items()}

          def normalize_lang_tokens(lang_str: str) -> set:
              if not lang_str:
                  return set()
              low = lang_str.strip().lower()
              if low in {"und", "unk", "unknown", "zxx", "mis", "mul", "none", "n/a"}:
                  return set()
              primary = re.split(r"[-_\s(]", low)[0]
              return {low, primary}

          def is_commentary_audio(stream: dict, tags: dict) -> bool:
              disp = stream.get("disposition") or {}
              if (
                  disp.get("comment", 0) == 1
                  or disp.get("visual_impaired", 0) == 1
                  or disp.get("descriptions", 0) == 1
              ):
                  return True
              title = tags.get("title", "")
              if title and COMMENTARY_RE.search(title):
                  return True
              return False

          # 2. Parallel ffprobe across all discovered episodes/files
          def probe_file(fpath: str):
              probe_cmd = [
                  "ffprobe", "-v", "quiet",
                  "-print_format", "json",
                  "-show_streams", "-show_chapters",
                  fpath
              ]
              try:
                  out = subprocess.check_output(probe_cmd, text=True)
                  return json.loads(out)
              except Exception as e:
                  return {"error": str(e)}

          with ThreadPoolExecutor(max_workers=min(8, len(target_files))) as pool:
              probe_results = list(pool.map(probe_file, target_files))

          # 3. Audit & Remux each media file in chronological order
          HEADER_KEEP = 64 * MB
          FOOTER_KEEP = 64 * MB
          SAFETY_LAG = 512 * MB
          MIN_PUNCH_STEP = 128 * MB

          def get_ffmpeg_min_read_pos(pid: int, target_inode_id: tuple):
              fd_dir = f"/proc/{pid}/fd"
              fdinfo_dir = f"/proc/{pid}/fdinfo"
              positions = []
              try:
                  for fd_name in os.listdir(fd_dir):
                      try:
                          st = os.stat(f"{fd_dir}/{fd_name}")
                          if (st.st_dev, st.st_ino) == target_inode_id:
                              with open(f"{fdinfo_dir}/{fd_name}", "r") as f:
                                  for line in f:
                                      if line.startswith("pos:"):
                                          positions.append(int(line.split()[1]))
                                          break
                      except OSError:
                          continue
              except OSError:
                  pass
              return min(positions) if positions else None

          for idx, (target_file, probe_data) in enumerate(zip(target_files, probe_results), 1):
              orig_size = os.path.getsize(target_file)
              target_stat = os.stat(target_file)
              target_inode_id = (target_stat.st_dev, target_stat.st_ino)
              free_before = shutil.disk_usage(WORKSPACE_DIR).free

              print(f"\n🎬 [{idx}/{len(target_files)}] Inspecting: {os.path.basename(target_file)} ({orig_size / GB:.2f} GiB) | Free Disk: {free_before / GB:.2f} GiB")

              if "error" in probe_data or not probe_data.get("streams"):
                  print(f"⚠️ ffprobe skipped ({probe_data.get('error', 'no streams')}); passing file through untouched.")
                  continue

              streams = probe_data.get("streams", [])
              chapters = probe_data.get("chapters", [])

              video_keep, video_drop = [], []
              audio_all, audio_keep, audio_drop = [], [], []
              sub_keep, sub_drop = [], []
              other_drop = []

              for s in streams:
                  ctype = (s.get("codec_type") or "").lower()
                  cname = (s.get("codec_name") or "unknown").lower()
                  disp = s.get("disposition") or {}
                  tags = get_tags(s)
                  lang_raw = tags.get("language", "")
                  title_raw = tags.get("title", "")
                  lang_tokens = normalize_lang_tokens(lang_raw)

                  if ctype == "video":
                      if disp.get("attached_pic", 0) == 1:
                          video_drop.append((s, "attached cover art"))
                      else:
                          video_keep.append(s)
                  elif ctype == "audio":
                      audio_all.append(s)
                      if is_commentary_audio(s, tags):
                          audio_drop.append((s, f"commentary/descriptive ({lang_raw or 'und'}: {title_raw or cname})"))
                      elif not (lang_tokens & ALLOWED_AUDIO_LANGS):
                          reason = "untagged/und" if not lang_tokens else f"disallowed language '{lang_raw}'"
                          audio_drop.append((s, reason))
                      else:
                          audio_keep.append(s)
                  elif ctype == "subtitle":
                      if not (lang_tokens & ALLOWED_SUB_LANGS):
                          reason = "untagged/und" if not lang_tokens else f"non-English '{lang_raw}'"
                          sub_drop.append((s, reason))
                      elif cname not in ALLOWED_TEXT_SUB_CODECS:
                          sub_drop.append((s, f"non-text/bitmap subtitle codec '{cname}'"))
                      else:
                          sub_keep.append(s)
                  else:
                      other_drop.append((s, f"stream type '{ctype}' ({cname})"))

              if not video_keep and video_drop:
                  video_keep.append(video_drop.pop(0)[0])

              if not audio_keep and audio_all:
                  non_comm = [s for s in audio_all if not is_commentary_audio(s, get_tags(s))]
                  pool = non_comm if non_comm else audio_all
                  fallback_track = next(
                      (s for s in pool if (s.get("disposition") or {}).get("default", 0) == 1),
                      pool[0]
                  )
                  audio_keep.append(fallback_track)
                  audio_drop = [(s, r) for s, r in audio_drop if s.get("index") != fallback_track.get("index")]
                  print(f"⚠️ Zero audio tracks matched allowed languages; falling back to stream #{fallback_track.get('index')} so output isn't mute.")

              print(f"📊 Stream Audit: Video Keep={len(video_keep)} Drop={len(video_drop)} | "
                    f"Audio Keep={len(audio_keep)} Drop={len(audio_drop)} | "
                    f"Sub Keep={len(sub_keep)} Drop={len(sub_drop)} | "
                    f"Attachments/Other Drop={len(other_drop)} | Chapters Drop={len(chapters)}")

              for s in audio_keep:
                  t = get_tags(s)
                  print(f"  ✅ KEEP AUDIO #{s.get('index')}: codec={s.get('codec_name')} lang={t.get('language', 'und')} title={t.get('title', '-')}")
              for s, reason in audio_drop:
                  t = get_tags(s)
                  print(f"  🗑️ DROP AUDIO #{s.get('index')}: codec={s.get('codec_name')} lang={t.get('language', 'und')} title={t.get('title', '-')} -> {reason}")
              for s in sub_keep:
                  t = get_tags(s)
                  print(f"  ✅ KEEP SUB   #{s.get('index')}: codec={s.get('codec_name')} lang={t.get('language', 'und')} title={t.get('title', '-')}")
              for s, reason in sub_drop:
                  t = get_tags(s)
                  print(f"  🗑️ DROP SUB   #{s.get('index')}: codec={s.get('codec_name')} lang={t.get('language', 'und')} title={t.get('title', '-')} -> {reason}")

              total_dropped_items = len(video_drop) + len(audio_drop) + len(sub_drop) + len(other_drop) + len(chapters)
              if total_dropped_items == 0:
                  print("✨ File is already completely clean (no bloat tracks, chapters, or attachments). Skipping remux!")
                  continue

              ext = os.path.splitext(target_file)[1].lower()
              if ext not in {".mkv", ".mp4"}:
                  ext = ".mkv"
              temp_output = os.path.join(os.path.dirname(target_file), f".lean_remux_tmp_{idx}{ext}")

              cmd = [
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-nostdin", "-y",
                  "-i", target_file,
                  "-map_chapters", "-1",
                  "-dn",
              ]
              for s in video_keep:
                  cmd += ["-map", f"0:{s['index']}"]
              for s in audio_keep:
                  cmd += ["-map", f"0:{s['index']}"]
              for s in sub_keep:
                  cmd += ["-map", f"0:{s['index']}"]

              if ext == ".mp4":
                  cmd += ["-c:v", "copy", "-c:a", "copy", "-c:s", "mov_text"]
              else:
                  cmd += ["-c", "copy"]

              if audio_keep and not any((s.get("disposition") or {}).get("default", 0) == 1 for s in audio_keep):
                  cmd += ["-disposition:a:0", "default"]

              cmd += ["-max_muxing_queue_size", "9999", temp_output]

              punch_fd = None
              if linux_fallocate is not None and orig_size > (HEADER_KEEP + FOOTER_KEEP + SAFETY_LAG):
                  try:
                      punch_fd = os.open(target_file, os.O_RDWR)
                  except OSError:
                      punch_fd = None

              print(f"🚀 Starting stream-copy remux (Live Sparse Hole-Punching: {'ACTIVE' if punch_fd is not None else 'INACTIVE'})...")

              t0 = time.perf_counter()
              proc = subprocess.Popen(cmd, stderr=subprocess.PIPE, text=True)

              punched_up_to = HEADER_KEEP
              total_punched = 0
              next_log_threshold = 10 * GB
              recent_positions = deque(maxlen=15)

              try:
                  while proc.poll() is None:
                      if punch_fd is not None:
                          try:
                              out_sz = os.path.getsize(temp_output) if os.path.exists(temp_output) else 0
                          except OSError:
                              out_sz = 0

                          if out_sz >= 32 * MB:
                              cur_pos = get_ffmpeg_min_read_pos(proc.pid, target_inode_id)
                              if cur_pos is not None and cur_pos >= HEADER_KEEP:
                                  recent_positions.append(cur_pos)
                                  if len(recent_positions) >= 5:
                                      safe_read_pos = min(recent_positions)
                                      raw_limit = min(orig_size - FOOTER_KEEP, safe_read_pos - SAFETY_LAG)
                                      aligned_limit = (raw_limit // MB) * MB
                                      if aligned_limit - punched_up_to >= MIN_PUNCH_STEP:
                                          punch_len = aligned_limit - punched_up_to
                                          try:
                                              linux_fallocate(punch_fd, PUNCH_MODE, punched_up_to, punch_len)
                                              if total_punched == 0:
                                                  print(f"  ⚡ First hole-punch succeeded: deallocated {punch_len / MB:.0f} MiB at offset {punched_up_to / MB:.0f} MiB")
                                              total_punched += punch_len
                                              punched_up_to = aligned_limit
                                              if total_punched >= next_log_threshold:
                                                  free_now = shutil.disk_usage(WORKSPACE_DIR).free
                                                  print(f"  ♻️ Hole-Punched: {total_punched / GB:.2f} GiB | Temp Out: {out_sz / GB:.2f} GiB | Free Disk: {free_now / GB:.2f} GiB")
                                                  next_log_threshold += 10 * GB
                                          except OSError as e:
                                              print(f"  ⚠️ fallocate64 punch failed ({e}); disabling further hole-punching.")
                                              os.close(punch_fd)
                                              punch_fd = None
                      time.sleep(0.01)
              finally:
                  if punch_fd is not None:
                      try:
                          os.close(punch_fd)
                      except OSError:
                          pass

              _, stderr_out = proc.communicate()
              elapsed = max(0.001, time.perf_counter() - t0)

              if proc.returncode != 0 or not os.path.exists(temp_output) or os.path.getsize(temp_output) == 0:
                  print(f"❌ ffmpeg remux failed (exit {proc.returncode}):\n{stderr_out}")
                  if os.path.exists(temp_output):
                      os.remove(temp_output)
                  if total_punched > 0:
                      print("❌ Input file had sparse blocks deallocated before failure; aborting workflow.")
                      sys.exit(1)
                  print("⚠️ Continuing with original unstripped file.")
                  continue

              new_size = os.path.getsize(temp_output)
              os.replace(temp_output, target_file)
              saved_gib = (orig_size - new_size) / GB
              speed_mibs = (new_size / MB) / elapsed

              print(
                  f"✅ Remux complete in {elapsed:.1f}s ({speed_mibs:.1f} MiB/s) | "
                  f"Size: {orig_size / GB:.2f} GiB -> {new_size / GB:.2f} GiB "
                  f"(Stripped {saved_gib:.2f} GiB of bloat, In-Flight Hole-Punched: {total_punched / GB:.2f} GiB)"
              )
          EOF_BLOAT

          python3 -u strip_bloat.py
          rm -f strip_bloat.py

      - name: Sequential Stream, Chunk, and Upload to
        if: env.found == 'true'
        env:
          BG_API_ID: ${{ secrets.BG_API_ID }}
          BG_API_HASH: ${{ secrets.BG_API_HASH }}
          BG_BOT_TOKEN: ${{ secrets.BG_BOT_TOKEN }}
          BG_CHAT_ID: ${{ secrets.BG_CHAT_ID }}
        run: |
          cat << 'EOF_PY' > upload_processor.py
          import os
          import sys
          import re
          import math
          import time
          import random
          import asyncio
          import uvloop
          from pyrogram import Client, raw
          from pyrogram.session import Session
          from pyrogram.errors import FloodWait

          # Guarantee real-time live streaming logs in GitHub Actions
          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          uvloop.install()

          API_ID = int(os.environ['BG_API_ID'])
          API_HASH = os.environ['BG_API_HASH']
          CHAT_ID = int(os.environ['BG_CHAT_ID'])

          BOT_TOKENS = [t.strip() for t in os.environ.get('BG_BOT_TOKEN', '').split(',') if t.strip()]
          if not BOT_TOKENS:
              print("❌ No bot tokens found in BG_BOT_TOKEN.")
              sys.exit(1)

          print(f"🤖 Detected {len(BOT_TOKENS)} bot token(s) in current execution run.")

          # Discover and naturally sort all media files in workspace/ (S03E01 -> S03E10 or single movie)
          workspace_dir = 'workspace'
          EP_SORT_RE = re.compile(r"(?i)\b(?:s(\d{1,4})[._\s-]*)?e(\d{1,4})\b")

          def media_sort_key(path: str):
              name = os.path.basename(path)
              m = EP_SORT_RE.search(name)
              s_num = int(m.group(1)) if (m and m.group(1)) else 0
              e_num = int(m.group(2)) if m else 999999
              nat = [int(t) if t.isdigit() else t.lower() for t in re.split(r"(\d+)", name)]
              return (s_num, e_num, nat)

          all_files = sorted(
              [
                  os.path.join(root, f)
                  for root, _, files in os.walk(workspace_dir)
                  for f in files
              ],
              key=media_sort_key
          )
          if not all_files:
              print("❌ No files found in workspace.")
              sys.exit(1)

          # MTProto maximum geometry: 3990 parts * 512 KiB = 1995.0 MiB per chunk
          PART_SIZE = 512 * 1024
          PARTS_PER_CHUNK = 3990
          CHUNK_SIZE = PARTS_PER_CHUNK * PART_SIZE

          # Build unified global chunk manifest across all episodes/files so bots never idle between files
          episodes = []
          global_tasks = []  # Each item: (global_idx, ep_idx, ep_chunk_idx, ep_total_chunks, chunk_offset, chunk_size, chunk_filename)
          total_payload_bytes = 0

          for ep_idx, fpath in enumerate(all_files):
              fsize = os.path.getsize(fpath)
              fname = os.path.basename(fpath)
              total_payload_bytes += fsize
              ep_chunks = max(1, math.ceil(fsize / CHUNK_SIZE))
              fd = os.open(fpath, os.O_RDONLY)
              if hasattr(os, "posix_fadvise") and hasattr(os, "POSIX_FADV_SEQUENTIAL"):
                  try:
                      os.posix_fadvise(fd, 0, fsize, os.POSIX_FADV_SEQUENTIAL)
                  except OSError:
                      pass

              episodes.append({
                  "path": fpath,
                  "name": fname,
                  "size": fsize,
                  "fd": fd,
                  "total_chunks": ep_chunks,
                  "closed": False
              })

              for c_idx in range(1, ep_chunks + 1):
                  c_offset = (c_idx - 1) * CHUNK_SIZE
                  c_size = min(CHUNK_SIZE, fsize - c_offset)
                  c_name = f"{fname}.{c_idx:03d}"
                  global_tasks.append((
                      len(global_tasks),
                      ep_idx,
                      c_idx,
                      ep_chunks,
                      c_offset,
                      c_size,
                      c_name
                  ))

          total_global_chunks = len(global_tasks)
          active_bot_count = min(len(BOT_TOKENS), total_global_chunks)
          SESSIONS_PER_BOT = 8
          MAX_INFLIGHT_PER_SOCKET = 3
          WORKERS_PER_BOT = SESSIONS_PER_BOT * MAX_INFLIGHT_PER_SOCKET
          RPC_HARD_TIMEOUT = 12.0

          print(
              f"🎬 Queue Summary: {len(episodes)} File(s) | "
              f"Total Size: {total_payload_bytes / (1024**3):.2f} GiB | "
              f"Total Chunks: {total_global_chunks} (1995 MiB max)"
          )
          print(
              f"⚡ Swarm Config: {active_bot_count} Active Bot(s) × {SESSIONS_PER_BOT} Sockets/Bot × "
              f"{MAX_INFLIGHT_PER_SOCKET} In-Flight/Socket = {active_bot_count * WORKERS_PER_BOT} Parallel Streams"
          )


          class BotSwarmNode:
              def __init__(self, idx: int, token: str):
                  self.idx = idx
                  self.token = token
                  self.client = Client(
                      name=f"swarm_bot_{idx}",
                      api_id=API_ID,
                      api_hash=API_HASH,
                      bot_token=token,
                      in_memory=True,
                      no_updates=True,
                      sleep_threshold=0
                  )
                  async def _ignore_updates(*args, **kwargs):
                      pass
                  self.client.handle_updates = _ignore_updates
                  self.dc_id = None
                  self.auth_key = None
                  self.test_mode = None
                  self.peer = None

                  self.media_sessions = [None] * SESSIONS_PER_BOT
                  self.slot_locks = [asyncio.Lock() for _ in range(SESSIONS_PER_BOT)]
                  self.slot_sems = [asyncio.Semaphore(MAX_INFLIGHT_PER_SOCKET) for _ in range(SESSIONS_PER_BOT)]
                  self.slot_gens = [0] * SESSIONS_PER_BOT
                  self.cooldown_until = 0.0

              async def _create_media_session(self) -> Session:
                  while True:
                      s = Session(
                          self.client,
                          self.dc_id,
                          self.auth_key,
                          self.test_mode,
                          is_media=True
                      )
                      try:
                          await asyncio.wait_for(s.start(), timeout=15.0)
                          return s
                      except Exception:
                          asyncio.create_task(self._safe_discard(s))
                          await asyncio.sleep(1.0)

              async def _safe_discard(self, old_session: Session):
                  if old_session is None:
                      return
                  try:
                      await asyncio.wait_for(old_session.stop(), timeout=3.0)
                  except Exception:
                      pass

              async def start(self):
                  await self.client.start()
                  self.peer = await self.client.resolve_peer(CHAT_ID)
                  self.dc_id = await self.client.storage.dc_id()
                  self.auth_key = await self.client.storage.auth_key()
                  self.test_mode = await self.client.storage.test_mode()

                  created = await asyncio.gather(*(self._create_media_session() for _ in range(SESSIONS_PER_BOT)))
                  for i, s in enumerate(created):
                      self.media_sessions[i] = s

              async def heal_slot(self, slot_idx: int, failed_gen: int):
                  async with self.slot_locks[slot_idx]:
                      if self.slot_gens[slot_idx] != failed_gen:
                          return
                      old_sess = self.media_sessions[slot_idx]
                      new_sess = await self._create_media_session()
                      self.media_sessions[slot_idx] = new_sess
                      self.slot_gens[slot_idx] += 1
                      asyncio.create_task(self._safe_discard(old_sess))

              def register_floodwait(self, wait_seconds: float):
                  target_wakeup = time.monotonic() + wait_seconds + 0.3
                  if target_wakeup > self.cooldown_until:
                      self.cooldown_until = target_wakeup

              async def wait_if_cooling_down(self):
                  while True:
                      rem = self.cooldown_until - time.monotonic()
                      if rem <= 0:
                          return
                      await asyncio.sleep(rem + random.uniform(0.02, 0.25))

              async def push_part(self, fd: int, preferred_slot: int, file_id: int, part_idx: int, total_parts: int, offset: int, size: int):
                  payload = os.pread(fd, size, offset)
                  query = raw.functions.upload.SaveBigFilePart(
                      file_id=file_id,
                      file_part=part_idx,
                      file_total_parts=total_parts,
                      bytes=payload
                  )
                  attempt = 0
                  while True:
                      await self.wait_if_cooling_down()
                      slot = (preferred_slot + attempt) % SESSIONS_PER_BOT

                      async with self.slot_sems[slot]:
                          await self.wait_if_cooling_down()
                          sess = self.media_sessions[slot]
                          gen = self.slot_gens[slot]
                          try:
                              await asyncio.wait_for(
                                  sess.invoke(query, retries=0, timeout=RPC_HARD_TIMEOUT, sleep_threshold=0),
                                  timeout=RPC_HARD_TIMEOUT + 2.0
                              )
                              return
                          except FloodWait as e:
                              self.register_floodwait(e.value)
                          except Exception:
                              attempt += 1
                              await self.heal_slot(slot, gen)
                              await asyncio.sleep(min(0.2 * attempt, 1.5))

              async def stop(self):
                  await asyncio.gather(*(self._safe_discard(s) for s in self.media_sessions), return_exceptions=True)
                  try:
                      await asyncio.wait_for(self.client.stop(), timeout=5.0)
                  except Exception:
                      pass


          async def upload_chunk_on_node(node: BotSwarmNode, task: tuple):
              global_idx, ep_idx, c_idx, ep_total_chunks, chunk_offset, this_chunk_size, chunk_filename = task
              ep = episodes[ep_idx]
              fd = ep["fd"]

              t0 = time.perf_counter()
              total_parts = math.ceil(this_chunk_size / PART_SIZE)
              file_id = random.getrandbits(63)

              print(
                  f"🚀 [Bot #{node.idx + 1}] Pre-uploading [{global_idx + 1}/{total_global_chunks}] "
                  f"{chunk_filename} ({this_chunk_size / (1024**2):.1f} MiB, {total_parts} parts)..."
              )

              part_cursor = 0

              async def worker(worker_id: int):
                  nonlocal part_cursor
                  preferred_slot = worker_id % SESSIONS_PER_BOT
                  while True:
                      p_idx = part_cursor
                      if p_idx >= total_parts:
                          return
                      part_cursor += 1
                      p_offset = chunk_offset + (p_idx * PART_SIZE)
                      p_size = min(PART_SIZE, (chunk_offset + this_chunk_size) - p_offset)
                      await node.push_part(
                          fd,
                          preferred_slot,
                          file_id,
                          p_idx,
                          total_parts,
                          p_offset,
                          p_size
                      )

              await asyncio.gather(*(worker(w) for w in range(WORKERS_PER_BOT)))

              elapsed = max(0.001, time.perf_counter() - t0)
              mbps = (this_chunk_size / (1024 * 1024)) / elapsed
              print(
                  f"⚡ [Bot #{node.idx + 1}] Finished [{global_idx + 1}/{total_global_chunks}] "
                  f"{chunk_filename} in {elapsed:.1f}s ({mbps:.1f} MiB/s)"
              )

              input_file = raw.types.InputFileBig(
                  id=file_id,
                  parts=total_parts,
                  name=chunk_filename
              )
              return node, ep_idx, c_idx, ep_total_chunks, chunk_filename, input_file


          async def main():
              global_start = time.perf_counter()

              nodes = [BotSwarmNode(i, BOT_TOKENS[i]) for i in range(active_bot_count)]
              await asyncio.gather(*(n.start() for n in nodes))

              loop = asyncio.get_running_loop()
              chunk_futures = [loop.create_future() for _ in range(total_global_chunks)]
              task_queue = asyncio.Queue()
              for task in global_tasks:
                  task_queue.put_nowait(task)

              async def bot_worker_loop(node: BotSwarmNode):
                  while not task_queue.empty():
                      try:
                          task = task_queue.get_nowait()
                      except asyncio.QueueEmpty:
                          return
                      global_idx = task[0]
                      try:
                          res = await upload_chunk_on_node(node, task)
                          chunk_futures[global_idx].set_result(res)
                      except Exception as exc:
                          if not chunk_futures[global_idx].done():
                              chunk_futures[global_idx].set_exception(exc)
                          raise

              async def sequential_committer():
                  for global_idx in range(total_global_chunks):
                      node, ep_idx, c_idx, ep_total_chunks, chunk_filename, input_file = await chunk_futures[global_idx]
                      while True:
                          await node.wait_if_cooling_down()
                          try:
                              await asyncio.wait_for(
                                  node.client.invoke(
                                      raw.functions.InvokeWithoutUpdates(
                                          query=raw.functions.messages.SendMedia(
                                              peer=node.peer,
                                              media=raw.types.InputMediaUploadedDocument(
                                                  file=input_file,
                                                  mime_type="application/octet-stream",
                                                  attributes=[raw.types.DocumentAttributeFilename(file_name=chunk_filename)],
                                                  force_file=True
                                              ),
                                              message=chunk_filename,
                                              random_id=node.client.rnd_id()
                                          )
                                      ),
                                      retries=0,
                                      timeout=15.0,
                                      sleep_threshold=0
                                  ),
                                  timeout=18.0
                              )
                              print(f"✅ [Committed {global_idx + 1}/{total_global_chunks}] {chunk_filename} (via Bot #{node.idx + 1})")
                              break
                          except FloodWait as e:
                              node.register_floodwait(e.value)
                          except Exception:
                              await asyncio.sleep(1.5)

                      # Instant per-episode disk reclamation once its final chunk is committed
                      if c_idx == ep_total_chunks:
                          ep = episodes[ep_idx]
                          if not ep["closed"]:
                              ep["closed"] = True
                              try:
                                  os.close(ep["fd"])
                              except OSError:
                                  pass
                              try:
                                  os.remove(ep["path"])
                                  print(f"🧹 Reclaimed {ep['size'] / (1024**3):.2f} GiB on disk after committing '{ep['name']}'.")
                              except OSError:
                                  pass

              await asyncio.gather(
                  sequential_committer(),
                  *(bot_worker_loop(n) for n in nodes)
              )

              for ep in episodes:
                  if not ep["closed"]:
                      try:
                          os.close(ep["fd"])
                      except OSError:
                          pass

              await asyncio.gather(*(n.stop() for n in nodes))

              total_elapsed = max(0.001, time.perf_counter() - global_start)
              agg_speed = (total_payload_bytes / (1024 * 1024)) / total_elapsed
              print(f"\n🎉 All {total_global_chunks} chunks across {len(episodes)} file(s) uploaded & committed in {total_elapsed:.1f}s (Effective: {agg_speed:.1f} MiB/s)!")

          asyncio.run(main())
          EOF_PY

          python3 -u upload_processor.py
          rm -rf workspace/ upload_processor.py
