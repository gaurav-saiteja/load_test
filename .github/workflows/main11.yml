              total_files = len(files_to_download)
              workers = min(2, max(1, total_files))

              def download_one(idx: int, fmeta: dict):
                  fid = fmeta["id"]
                  fname = fmeta["name"]
                  fsize = int(fmeta.get("size", 0))
                  out_path = os.path.join("workspace", fname)
