                  headers = {"Authorization": f"Bearer {get_valid_token()}"}
                  written = stream_to_disk_zero_copy(session, url, headers, out_path, fsize)
                  elapsed = max(0.001, time.perf_counter() - t0)
                  print(f"✅ [{idx}/{total_files}] Finished '{fname}' in {elapsed:.1f}s ({(written / MB) / elapsed:.1f} MiB/s)")

              with ThreadPoolExecutor(max_workers=workers) as pool:
                  futs = [pool.submit(download_one, idx, fmeta) for idx, fmeta in enumerate(files_to_download, 1)]
                  for fut in as_completed(futs):
                      fut.result()
          EOF_GDRIVE
