name: NUPPPP 11
on:
  workflow_dispatch:
    inputs:
      target_link:
        description: 'Direct link to payload (Drive, Torrent, Magnet)'
        required: true
        type: string
      imdb_id:
        description: 'IMDb ID (e.g., tt15239678)'
        required: true
        type: string
      season_override:
        description: 'Optional Season number override (for single episode files without SxxExx in name)'
        required: false
        type: string
        default: ''
      episode_override:
        description: 'Optional Episode number override (for single episode files without SxxExx in name)'
        required: false
        type: string
        default: ''
      quality_override:
        description: 'Optional Quality Source override (auto, BluRay REMUX, BluRay, WEB-DL, WEBRip)'
        required: false
        type: string
        default: 'auto'
      edition_override:
        description: 'Optional Edition tag (e.g., IMAX, Extended, Theatrical)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "UTF-8"
  PYTHONPATH: "/opt/fastdeps/pydeps"
  HF_XET_HIGH_PERFORMANCE: "1"
  HF_XET_CACHE: "/tmp/hf_xet_cache"

jobs:
  process-queue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache System and Python Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: /tmp/stage_root
          key: ${{ runner.os }}-deps-v7

      - name: Install Dependencies & Tune Kernel Network Stack
        run: |
          T_START=$(date +%s%3N)

          # 1. Front-load multi-gigabit TCP/BBR kernel tuning for both ingress (downloads) and egress (uploads)
          sudo sysctl -w net.core.rmem_max=134217728 >/dev/null 2>&1 || true
          sudo sysctl -w net.core.wmem_max=134217728 >/dev/null 2>&1 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 134217728" >/dev/null 2>&1 || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 87380 134217728" >/dev/null 2>&1 || true
          sudo sysctl -w net.core.netdev_max_backlog=250000 >/dev/null 2>&1 || true
          sudo sysctl -w net.core.default_qdisc=fq >/dev/null 2>&1 || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr >/dev/null 2>&1 || true

          # 2. Restore or build cached binary & Python dependencies
          if [ -d "/tmp/stage_root/opt/fastdeps/pydeps" ] && [ -x "/tmp/stage_root/usr/local/bin/ffmpeg" ] && PYTHONPATH="/tmp/stage_root/opt/fastdeps/pydeps" /usr/bin/python3 -c "import huggingface_hub, hf_xet" >/dev/null 2>&1; then
            echo "⚡ Cache HIT! Deploying pre-built binaries and Python dependencies..."
            sudo tar -cf - -C /tmp/stage_root . | sudo tar --keep-directory-symlink -xf - -C /
            sudo rm -rf /tmp/stage_root
          else
            echo "🛠️ Cache MISS. Downloading and packing all system, CLI, and Python dependencies..."
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
            sudo apt-get update -qq

            mkdir -p /tmp/debs /tmp/stage_root/opt/fastdeps/pydeps /tmp/stage_root/usr/local/bin

            # Download .deb packages (aria2, unrar, cloudflare-warp) and all their shared libraries
            sudo apt-get install -y --download-only -o Dir::Cache::archives="/tmp/debs" aria2 unrar cloudflare-warp
            for deb in /tmp/debs/*.deb; do
              dpkg-deb -x "$deb" /tmp/stage_root
            done
            rm -rf /tmp/debs

            # Fetch static qbittorrent-nox and FFmpeg binaries in parallel into cached stage_root
            curl -fsSL https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/x86_64-qbittorrent-nox -o /tmp/stage_root/usr/local/bin/qbittorrent-nox &
            PID_QBIT=$!
            
            (
              curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ffmpeg.tar.xz
              tar -xf /tmp/ffmpeg.tar.xz -C /tmp
              cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/stage_root/usr/local/bin/
              cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /tmp/stage_root/usr/local/bin/
            ) &
            PID_FFMPEG=$!
            
            wait $PID_QBIT $PID_FFMPEG
            chmod +x /tmp/stage_root/usr/local/bin/*

            # Strip docs and man pages to shrink cache archive size
            rm -rf /tmp/stage_root/usr/share/doc /tmp/stage_root/usr/share/man /tmp/stage_root/usr/share/locale

            # Pre-install Python packages (including Rust hf_xet engine) into cached target directory
            /usr/bin/python3 -m pip --version >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends python3-pip
            /usr/bin/python3 -m pip install -U --break-system-packages --target=/tmp/stage_root/opt/fastdeps/pydeps \
              "huggingface_hub[hf_xet]" requests[socks] google-auth tqdm
            find /tmp/stage_root/opt/fastdeps/pydeps -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

            echo "📦 Syncing staged dependencies to root filesystem..."
            sudo tar -cf - -C /tmp/stage_root . | sudo tar --keep-directory-symlink -xf - -C /
          fi

          # 3. Link shared libraries and start warp-svc daemon non-blockingly in the background
          sudo ldconfig
          sudo mkdir -p /var/lib/cloudflare-warp /run/cloudflare-warp
          sudo systemctl daemon-reload
          sudo systemctl start warp-svc >/dev/null 2>&1 || sudo env RUNNER_TRACKING_ID="" bash -c 'nohup warp-svc >/dev/null 2>&1 &'

          T_END=$(date +%s%3N)
          echo "✅ Dependencies & kernel tuning ready in $((T_END - T_START)) ms."

      - name: Acknowledge & Assess Payload Size
        id: payload_ack
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          RAW_TARGET_LINK: ${{ inputs.target_link }}
        run: |
          echo "Target acquired: $RAW_TARGET_LINK"
          {
            echo "TARGET_LINK=$RAW_TARGET_LINK"
            echo "found=true"
          } >> "$GITHUB_ENV"

          cat << 'EOF_ASSESS' > assess_payload.py
          import os
          import sys
          import re
          import json
          import urllib.parse
          import requests

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          link = os.environ.get("RAW_TARGET_LINK", "").strip()
          sa_json_str = os.environ.get("GCP_SA_JSON", "").strip()
          github_env = os.environ.get("GITHUB_ENV")

          GIB = 1024 ** 3
          ARCHIVE_EXTS = (".zip", ".rar", ".7z", ".tar", ".tgz", ".tar.gz", ".bz2", ".xz", ".001", ".r00")

          def is_archive_name(name: str, mime: str = "") -> bool:
              low = (name or "").lower().strip()
              mlow = (mime or "").lower().strip()
              if any(low.endswith(ext) for ext in ARCHIVE_EXTS):
                  return True
              if any(k in mlow for k in ("zip", "rar", "7z", "tar", "compressed")):
                  return True
              return False

          def parse_bencode(data: bytes, idx: int = 0):
              c = chr(data[idx])
              if c == 'i':
                  end = data.index(b'e', idx)
                  return int(data[idx+1:end]), end + 1
              elif c == 'l':
                  idx += 1
                  lst = []
                  while chr(data[idx]) != 'e':
                      val, idx = parse_bencode(data, idx)
                      lst.append(val)
                  return lst, idx + 1
              elif c == 'd':
                  idx += 1
                  dct = {}
                  while chr(data[idx]) != 'e':
                      k, idx = parse_bencode(data, idx)
                      v, idx = parse_bencode(data, idx)
                      dct[k] = v
                  return dct, idx + 1
              else:
                  colon = data.index(b':', idx)
                  length = int(data[idx:colon])
                  start = colon + 1
                  return data[start:start+length], start + length

          def write_env(key: str, val: str):
              if github_env:
                  with open(github_env, "a", encoding="utf-8") as f:
                      f.write(f"{key}={val}\n")

          total_bytes = -1
          is_archive = False
          payload_name = "Unknown_Payload"
          use_proxy = "false"
          payload_type = "direct"

          try:
              # 1. Magnet URI
              if link.startswith("magnet:"):
                  payload_type = "torrent"
                  qs = urllib.parse.parse_qs(urllib.parse.urlsplit(link).query)
                  if "dn" in qs and qs["dn"]:
                      payload_name = urllib.parse.unquote(qs["dn"][0])
                      is_archive = is_archive_name(payload_name)
                  if "xl" in qs and qs["xl"]:
                      try:
                          total_bytes = int(qs["xl"][0])
                      except ValueError:
                          total_bytes = -1

              # 2. .torrent file URL
              elif ".torrent" in link.lower().split("?")[0]:
                  payload_type = "torrent"
                  r = requests.get(link, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                  if r.ok and r.content.startswith(b"d"):
                      with open("/tmp/payload.torrent", "wb") as tf:
                          tf.write(r.content)
                      meta, _ = parse_bencode(r.content)
                      info = meta.get(b"info", {})
                      if b"name" in info:
                          payload_name = info[b"name"].decode("utf-8", errors="replace")
                      if b"length" in info:
                          total_bytes = int(info[b"length"])
                          is_archive = is_archive_name(payload_name)
                      elif b"files" in info:
                          total_bytes = 0
                          for fitem in info[b"files"]:
                              flen = int(fitem.get(b"length", 0))
                              total_bytes += flen
                              fpath = "/".join(p.decode("utf-8", errors="replace") for p in fitem.get(b"path", []))
                              if is_archive_name(fpath):
                                  is_archive = True

              # 3. Google Drive Link
              elif "drive.google.com" in link or "drive.usercontent.google.com" in link:
                  if "&at=" in link or "confirm=t" in link:
                      payload_type = "gdrive_direct"
                      with requests.get(link, headers={"User-Agent": "Mozilla/5.0", "Range": "bytes=0-0"}, stream=True, timeout=10) as r:
                          cr = r.headers.get("Content-Range", "")
                          if "/" in cr:
                              total_bytes = int(cr.split("/")[-1])
                          elif r.headers.get("Content-Length"):
                              total_bytes = int(r.headers["Content-Length"])
                          cd = r.headers.get("Content-Disposition", "")
                          m = re.search(r'(?i)filename\*?=(?:\"?UTF-8\'\'\"?)?([^\r\n;]+)', cd)
                          if m:
                              payload_name = urllib.parse.unquote(m.group(1).strip(' "\''))
                          is_archive = is_archive_name(payload_name, r.headers.get("Content-Type", ""))
                  else:
                      payload_type = "gdrive_sa"
                      from google.oauth2 import service_account
                      from google.auth.transport.requests import Request
                      sa_info = json.loads(sa_json_str)
                      creds = service_account.Credentials.from_service_account_info(
                          sa_info, scopes=["https://www.googleapis.com/auth/drive.readonly"]
                      )
                      creds.refresh(Request())
                      headers = {"Authorization": f"Bearer {creds.token}"}
                      match = re.search(r"(id=|/d/|folders/)([a-zA-Z0-9_-]+)", link)
                      file_id = match.group(2)
                      files_manifest = []

                      def walk_drive(fid):
                          url = f"https://www.googleapis.com/drive/v3/files/{fid}?fields=id,name,mimeType,size&supportsAllDrives=true"
                          res = requests.get(url, headers=headers, timeout=10).json()
                          if res.get("mimeType") == "application/vnd.google-apps.folder":
                              page_token = None
                              while True:
                                  q_url = (
                                      f"https://www.googleapis.com/drive/v3/files?q='{fid}'+in+parents+and+trashed=false"
                                      f"&fields=nextPageToken,files(id,name,mimeType,size)&pageSize=1000"
                                      f"&supportsAllDrives=true&includeItemsFromAllDrives=true"
                                  )
                                  if page_token:
                                      q_url += f"&pageToken={page_token}"
                                  cres = requests.get(q_url, headers=headers, timeout=10).json()
                                  for child in cres.get("files", []):
                                      if child.get("mimeType") == "application/vnd.google-apps.folder":
                                          walk_drive(child["id"])
                                      else:
                                          files_manifest.append({
                                              "id": child["id"],
                                              "name": child.get("name", child["id"]),
                                              "size": int(child.get("size", 0)),
                                              "mimeType": child.get("mimeType", "")
                                          })
                                  page_token = cres.get("nextPageToken")
                                  if not page_token:
                                      break
                          else:
                              files_manifest.append({
                                  "id": fid,
                                  "name": res.get("name", fid),
                                  "size": int(res.get("size", 0)),
                                  "mimeType": res.get("mimeType", "")
                              })

                      walk_drive(file_id)
                      total_bytes = sum(f["size"] for f in files_manifest)
                      is_archive = any(is_archive_name(f["name"], f["mimeType"]) for f in files_manifest)
                      payload_name = files_manifest[0]["name"] if len(files_manifest) == 1 else f"Drive_Folder_{len(files_manifest)}_files"

                      # Cache manifest and bearer token so Download step starts immediately with zero extra API calls
                      with open("/tmp/gdrive_manifest.json", "w", encoding="utf-8") as mf:
                          json.dump({"token": creds.token, "files": files_manifest}, mf)

              # 4. Direct HTTP/HTTPS URL
              elif link.startswith(("http://", "https://")):
                  payload_type = "direct"
                  url_path = urllib.parse.unquote(urllib.parse.urlsplit(link).path.split("/")[-1])
                  if url_path:
                      payload_name = url_path

                  ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/539.36 (KHTML, like Gecko) Chrome/131.0.0.0 Safari/539.36"

                  def probe_http(proxies=None):
                      global total_bytes, payload_name, is_archive
                      h_resp = requests.head(link, headers={"User-Agent": ua}, allow_redirects=True, timeout=8, proxies=proxies)
                      headers_used = h_resp.headers
                      if h_resp.status_code >= 400 or ("Content-Length" not in h_resp.headers and "Content-Disposition" not in h_resp.headers):
                          g_resp = requests.get(
                              link,
                              headers={"User-Agent": ua, "Range": "bytes=0-0"},
                              stream=True,
                              allow_redirects=True,
                              timeout=8,
                              proxies=proxies
                          )
                          headers_used = g_resp.headers
                          g_resp.close()
                          if g_resp.status_code >= 400:
                              raise RuntimeError(f"HTTP {g_resp.status_code}")

                      cr = headers_used.get("Content-Range", "")
                      if "/" in cr and cr.split("/")[-1].isdigit():
                          total_bytes = int(cr.split("/")[-1])
                      elif headers_used.get("Content-Length", "").isdigit():
                          total_bytes = int(headers_used["Content-Length"])

                      cd = headers_used.get("Content-Disposition", "")
                      m = re.search(r'(?i)filename\*?=(?:\"?UTF-8\'\'\"?)?([^\r\n;]+)', cd)
                      if m:
                          payload_name = urllib.parse.unquote(m.group(1).strip(' "\''))
                      elif not payload_name or payload_name == "Unknown_Payload":
                          payload_name = "Direct_Payload.mkv"

                      is_archive = is_archive_name(payload_name, headers_used.get("Content-Type", ""))

                  try:
                      probe_http(proxies=None)
                      use_proxy = "false"
                  except Exception as direct_err:
                      print(f"⚡ Direct probe blocked ({direct_err}); connecting WARP to re-probe payload metadata...")
                      use_proxy = "true"
                      import subprocess
                      subprocess.run(
                          """
                          if ! pgrep -x "warp-svc" >/dev/null 2>&1; then
                            sudo mkdir -p /var/lib/cloudflare-warp /run/cloudflare-warp
                            sudo systemctl start warp-svc || (sudo nohup warp-svc >/dev/null 2>&1 &)
                          fi
                          for i in {1..30}; do warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 0.5; done
                          warp-cli --accept-tos registration new >/dev/null 2>&1 || true
                          warp-cli --accept-tos mode proxy
                          warp-cli --accept-tos connect
                          for i in {1..20}; do
                            curl -s -x http://127.0.0.1:40000 --max-time 3 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on" && break
                            sleep 1
                          done
                          """,
                          shell=True,
                          check=False
                      )
                      warp_proxies = {"http": "http://127.0.0.1:40000", "https": "http://127.0.0.1:40000"}
                      probe_http(proxies=warp_proxies)
          except Exception as e:
              print(f"⚠️ Pre-flight metadata probe warning ({e}); defaulting to safe storage cleanup.")

          # Decision gate:
          # - Archive (.zip/.rar/.7z/.tar) >= 40 GiB -> Free Space
          # - Non-Archive >= 80 GiB -> Free Space
          # - Unknown size (< 0) -> Free Space (safe fallback)
          if total_bytes < 0:
              need_free_space = "true"
              size_str = "Unknown (Safe Fallback)"
          else:
              size_gib = total_bytes / GIB
              size_str = f"{size_gib:.2f} GiB"
              threshold_gib = 60.0 if is_archive else 80.0
              need_free_space = "true" if size_gib >= threshold_gib else "false"

          print(
              f"📊 Pre-Flight Assessment: Name='{payload_name}' | Type={payload_type} | "
              f"Size={size_str} | Archive={is_archive} | Need Disk Cleanup={need_free_space}"
          )

          write_env("PAYLOAD_TYPE", payload_type)
          write_env("SERVER_FILENAME", payload_name if payload_name != "Unknown_Payload" else "Direct_Payload.mkv")
          write_env("USE_PROXY", use_proxy)
          write_env("NEED_FREE_SPACE", need_free_space)
          EOF_ASSESS

          /usr/bin/python3 -u assess_payload.py
          rm -f assess_payload.py

      - name: Free Up Disk Space (Ultra-Fast Parallel)
        if: env.found == 'true' && env.NEED_FREE_SPACE == 'true'
        run: |
          T_START=$(date +%s%3N)
          FREE_BEFORE=$(df -BG / | awk 'NR==2 {print $4}')
          echo "🧹 Executing high-speed parallel disk cleanup on ubuntu-latest (Free before: ${FREE_BEFORE})..."

          # 1. Disable and unlink swapfile in background
          (sudo swapoff -a >/dev/null 2>&1 || true; sudo rm -f /mnt/swapfile) &

          # 2. Stop container daemons and nuke Docker/containerd image stores in background
          (
            sudo systemctl stop docker.socket docker.service containerd.service >/dev/null 2>&1 || true
            sudo rm -rf /var/lib/docker /var/lib/containerd
          ) &

          # 3. Spawn parallel rm -rf workers across all heavy pre-installed ubuntu-latest SDKs
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/ghc /usr/local/.ghcup &
          sudo rm -rf /opt/hostedtoolcache &
          sudo rm -rf /usr/lib/jvm &
          sudo rm -rf /usr/lib/llvm-* &
          sudo rm -rf /opt/az /usr/share/az_* /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/google-cloud-sdk &
          sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/local/julia* &
          sudo rm -rf /usr/local/share/chromium /opt/google/chrome /opt/microsoft &
          sudo rm -rf /usr/share/rust /home/runner/.rustup /home/runner/.cargo &
          sudo rm -rf /var/cache/apt/archives /var/lib/apt/lists/* /usr/share/doc /usr/share/man &

          wait
          T_END=$(date +%s%3N)
          FREE_AFTER=$(df -BG / | awk 'NR==2 {print $4}')
          echo "⚡ Disk cleanup finished in $((T_END - T_START)) ms! Free space: ${FREE_BEFORE} -> ${FREE_AFTER}"

      - name: Download and Extract Payload
        if: env.found == 'true'
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          mkdir -p workspace

          # Helper function: Lazily connect Cloudflare WARP only when needed (torrents or blocked direct hosts)
          ensure_warp_connected() {
            if curl -s -x http://127.0.0.1:40000 --max-time 2 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "✅ WARP proxy already active on 127.0.0.1:40000"
              return 0
            fi
            echo "🌐 Connecting Cloudflare WARP SOCKS5 proxy..."
            if ! pgrep -x "warp-svc" >/dev/null 2>&1; then
              sudo mkdir -p /var/lib/cloudflare-warp /run/cloudflare-warp
              sudo systemctl start warp-svc || (sudo nohup warp-svc >/dev/null 2>&1 &)
            fi
            for i in {1..30}; do
              if warp-cli --accept-tos status >/dev/null 2>&1; then break; fi
              sleep 0.5
            done
            warp-cli --accept-tos registration new >/dev/null 2>&1 || true
            warp-cli --accept-tos mode proxy
            warp-cli --accept-tos connect
            for i in {1..20}; do
              if curl -s -x socks5h://127.0.0.1:40000 --max-time 3 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
                echo "✅ WARP proxy active on 127.0.0.1:40000"
                break
              fi
              sleep 1
            done
          }

          # -------------------------------------------------------------------------
          # PATH 1: GOOGLE DRIVE (16-Connection Parallel Range Slicing via aria2c)
          # -------------------------------------------------------------------------
          if [[ "$PAYLOAD_TYPE" == "gdrive_direct" ]] || [[ "$PAYLOAD_TYPE" == "gdrive_sa" ]]; then
          ensure_warp_connected
            cat << 'EOF_GDRIVE' > gdrive_fast_dl.py
          import os
          import sys
          import re
          import json
          import time
          import queue
          import ctypes
          import socket
          import threading
          import urllib.parse
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.connection import HTTPConnection
          from concurrent.futures import ThreadPoolExecutor, as_completed

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          link = sys.argv[1]
          payload_type = os.environ.get("PAYLOAD_TYPE", "gdrive_sa")
          server_filename = os.environ.get("SERVER_FILENAME", "Drive_Payload.mkv")
          sa_json_str = os.environ.get("GCP_SA_JSON", "")

          MB = 1024 * 1024
          GB = 1024 * MB
          SLAB_SIZE = 16 * MB
          NUM_SLABS = 3
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/539.36 (KHTML, like Gecko) Chrome/131.0.0.0 Safari/539.36"

          # Bind libc fallocate64 for instant zero-stall ext4 extent pre-allocation
          try:
              _libc = ctypes.CDLL("libc.so.6", use_errno=True)
              _fallocate64 = getattr(_libc, "fallocate64", getattr(_libc, "fallocate"))
              _fallocate64.argtypes = [ctypes.c_int, ctypes.c_int, ctypes.c_int64, ctypes.c_int64]
              _fallocate64.restype = ctypes.c_int

              def preallocate_file(fd: int, size: int):
                  if size > 0:
                      _fallocate64(fd, 0, 0, size)
          except Exception:
              def preallocate_file(fd: int, size: int):
                  pass

          # Tune underlying urllib3 sockets for 16 MiB SO_RCVBUF and TCP_NODELAY
          class HighSpeedDriveAdapter(HTTPAdapter):
              def init_poolmanager(self, *args, **kwargs):
                  kwargs["socket_options"] = HTTPConnection.default_socket_options + [
                      (socket.SOL_SOCKET, socket.SO_RCVBUF, 16 * MB),
                      (socket.IPPROTO_TCP, socket.TCP_NODELAY, 1),
                  ]
                  super().init_poolmanager(*args, **kwargs)

          def build_session() -> requests.Session:
              s = requests.Session()
              adapter = HighSpeedDriveAdapter(pool_connections=4, pool_maxsize=8, max_retries=0)
              s.mount("https://", adapter)
              s.mount("http://", adapter)
              return s

          def stream_to_disk_zero_copy(session: requests.Session, url: str, base_headers: dict, out_path: str, expected_size: int):
              fd = os.open(out_path, os.O_CREAT | os.O_WRONLY | os.O_TRUNC, 0o644)
              preallocated = False
              if expected_size > 0:
                  preallocate_file(fd, expected_size)
                  preallocated = True

              written = 0
              max_attempts = 6

              try:
                  for attempt in range(1, max_attempts + 1):
                      req_headers = dict(base_headers)
                      req_headers["User-Agent"] = UA
                      req_headers["Accept-Encoding"] = "identity"
                      if written > 0:
                          req_headers["Range"] = f"bytes={written}-"

                      try:
                          with session.get(url, headers=req_headers, stream=True, timeout=(15, 60)) as r:
                              if r.status_code >= 400:
                                  print(f"\n❌ GOOGLE API ERROR RESPONSE (HTTP {r.status_code}):\n{r.text}\n" + "-" * 40)
                                  r.raise_for_status()

                              if not preallocated and written == 0:
                                  cl = r.headers.get("Content-Length", "")
                                  if cl.isdigit() and int(cl) > 0:
                                      expected_size = int(cl)
                                      preallocate_file(fd, expected_size)
                                      preallocated = True

                              # Triple-buffered 16 MiB slabs for concurrent socket-read + os.pwrite
                              slabs = [bytearray(SLAB_SIZE) for _ in range(NUM_SLABS)]
                              views = [memoryview(b) for b in slabs]
                              free_q = queue.Queue()
                              write_q = queue.Queue()
                              for i in range(NUM_SLABS):
                                  free_q.put(i)

                              writer_err = []

                              def disk_writer():
                                  nonlocal written
                                  while True:
                                      item = write_q.get()
                                      if item is None:
                                          write_q.task_done()
                                          break
                                      idx, nbytes = item
                                      try:
                                          mv = views[idx][:nbytes]
                                          off = 0
                                          while off < nbytes:
                                              w = os.pwrite(fd, mv[off:], written + off)
                                              off += w
                                          written += nbytes
                                      except Exception as e:
                                          writer_err.append(e)
                                      finally:
                                          free_q.put(idx)
                                          write_q.task_done()

                              wt = threading.Thread(target=disk_writer, daemon=True)
                              wt.start()

                              raw_stream = r.raw
                              try:
                                  while True:
                                      if writer_err:
                                          raise writer_err[0]
                                      idx = free_q.get()
                                      mv = views[idx]
                                      filled = 0
                                      while filled < SLAB_SIZE:
                                          n = raw_stream.readinto(mv[filled:])
                                          if not n:
                                              break
                                          filled += n
                                      if filled > 0:
                                          write_q.put((idx, filled))
                                      else:
                                          free_q.put(idx)
                                          break
                              finally:
                                  write_q.put(None)
                                  wt.join()

                              if writer_err:
                                  raise writer_err[0]

                              if expected_size > 0 and written < expected_size:
                                  raise IOError(f"Premature EOF at {written}/{expected_size} bytes")
                              break

                      except Exception as e:
                          if attempt == max_attempts:
                              raise
                          wait_s = min(2 ** attempt, 15)
                          print(f"⚠️ Stream interrupted at {written / MB:.1f} MiB ({e}); resuming in {wait_s}s [{attempt}/{max_attempts}]...")
                          time.sleep(wait_s)

                  if written > 0:
                      os.ftruncate(fd, written)
              finally:
                  os.close(fd)

              return written

          if payload_type == "gdrive_direct":
              session = build_session()
              out_path = os.path.join("workspace", server_filename)
              print(f"🚀 Downloading confirmed Google Drive link ('{server_filename}') via high-speed single stream...")
              t0 = time.perf_counter()
              total_written = stream_to_disk_zero_copy(session, link, {}, out_path, 0)
