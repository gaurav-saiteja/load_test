        run: |
          cat << 'EOF_BLOAT' > strip_bloat.py
          import os
          import sys
          import re
          import json
          import time
          import ctypes
          import shutil
          import hashlib
          import subprocess
          from collections import deque
          from concurrent.futures import ThreadPoolExecutor

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          WORKSPACE_DIR = "workspace"
          MB = 1024 * 1024
          GB = 1024 * MB

          IMDB_ID = os.environ.get("INPUT_IMDB_ID", "").strip()
          SEASON_OVR = os.environ.get("INPUT_SEASON_OVERRIDE", "").strip()
          EPISODE_OVR = os.environ.get("INPUT_EPISODE_OVERRIDE", "").strip()
          QUALITY_OVR = os.environ.get("INPUT_QUALITY_OVERRIDE", "auto").strip()
          EDITION_OVR = os.environ.get("INPUT_EDITION_OVERRIDE", "").strip()

          if not IMDB_ID.startswith("tt"):
              print(f"❌ Invalid or missing imdb_id ('{IMDB_ID}'). Must start with 'tt'.")
              sys.exit(1)

          # Bind directly to glibc fallocate64 with 64-bit offsets (supports files > 85 GiB)
          FALLOC_FL_KEEP_SIZE = 0x01
          FALLOC_FL_PUNCH_HOLE = 0x02
          PUNCH_MODE = FALLOC_FL_KEEP_SIZE | FALLOC_FL_PUNCH_HOLE

          try:
              _libc = ctypes.CDLL("libc.so.6", use_errno=True)
              _fallocate64 = getattr(_libc, "fallocate64", getattr(_libc, "fallocate"))
              _fallocate64.argtypes = [ctypes.c_int, ctypes.c_int, ctypes.c_int64, ctypes.c_int64]
              _fallocate64.restype = ctypes.c_int

              def linux_fallocate(fd: int, mode: int, offset: int, length: int):
                  res = _fallocate64(fd, mode, offset, length)
                  if res != 0:
                      err = ctypes.get_errno()
                      raise OSError(err, os.strerror(err) if err else "fallocate64 syscall failed")
          except Exception as e:
              print(f"⚠️ Could not bind libc.fallocate64 ({e})")
              linux_fallocate = None

          # 1. Multi-Episode & Movie Discovery + Natural Chronological Sorting
          VIDEO_EXTS = {".mkv", ".mp4", ".m2ts", ".ts", ".mov", ".avi", ".webm", ".m4v"}
          SAMPLE_RE = re.compile(r"(?i)(?:^|[._\s-])sample(?:[._\s-]|$)")
          EP_SORT_RE = re.compile(r"(?i)\b(?:s(\d{1,4})[._\s-]*)?e(\d{1,4})\b")

          def media_sort_key(path: str):
              name = os.path.basename(path)
              m = EP_SORT_RE.search(name)
              s_num = int(m.group(1)) if (m and m.group(1)) else 0
              e_num = int(m.group(2)) if m else 999999
              nat = [int(t) if t.isdigit() else t.lower() for t in re.split(r"(\d+)", name)]
              return (s_num, e_num, nat)

          all_files = [
              os.path.realpath(os.path.join(root, f))
              for root, _, files in os.walk(WORKSPACE_DIR)
              for f in files
          ]
          if not all_files:
              print("❌ No files found in workspace.")
              sys.exit(1)

          video_candidates = [
              f for f in all_files
              if os.path.splitext(f)[1].lower() in VIDEO_EXTS
              and os.path.getsize(f) >= 100 * MB
              and not SAMPLE_RE.search(os.path.basename(f))
          ]

          if not video_candidates:
              video_candidates = [max(all_files, key=os.path.getsize)]

          target_files = sorted(list(set(video_candidates)), key=media_sort_key)
          target_set = set(target_files)

          removed_extra_bytes = 0
          for fpath in all_files:
              if fpath not in target_set:
                  try:
                      removed_extra_bytes += os.path.getsize(fpath)
                      os.remove(fpath)
                  except OSError:
                      pass

          if removed_extra_bytes > 0:
              print(f"🧹 Purged {removed_extra_bytes / MB:.1f} MiB of ancillary non-media files from workspace.")

          total_initial_gib = sum(os.path.getsize(f) for f in target_files) / GB
          free_initial_gib = shutil.disk_usage(WORKSPACE_DIR).free / GB
          print(f"🎬 Discovered {len(target_files)} media file(s) ({total_initial_gib:.2f} GiB total) | Free Disk: {free_initial_gib:.2f} GiB")

          # Unified canonical language map (every allowed language is audited for Option A best-track selection)
          CANONICAL_AUDIO_LANGS = {
              "english": {
                  "en", "eng", "english", "en-us", "en-gb", "en-au", "en-ca",
                  "en-nz", "en-ie", "en-za", "en-in", "eng-us", "eng-gb",
                  "us", "uk", "gb", "american", "british"
              },
              "telugu": {"te", "tel", "telugu"},
              "hindi": {"hi", "hin", "hindi"},
              "tamil": {"ta", "tam", "tamil"},
              "malayalam": {"ml", "mal", "malayalam"},
              "kannada": {"kn", "kan", "kannada"},
              "thai": {"th", "tha", "thai"},
              "japanese": {"ja", "jpn", "jap", "japanese", "nihongo", "ja-jp", "jpn-jp", "jp", "日本語"},
              "korean": {"ko", "kor", "korean", "hanguk", "hangul", "ko-kr", "kor-kr", "kr", "한국어"},
              "spanish": {
                  "es", "spa", "esp", "spanish", "espanol", "español",
                  "castellano", "castilian", "lat", "latino", "latin",
                  "es-es", "es-419", "es-mx", "es-ar", "es-co", "es-cl",
                  "es-pe", "es-ve", "es-us", "es-la", "spa-es", "spa-419", "spa-la"
              },
              "french": {
                  "fr", "fre", "fra", "french", "francais", "français",
                  "vf", "vff", "vfq", "vfi", "vf2", "vof", "truefrench",
                  "fr-fr", "fr-ca", "fr-be", "fr-ch", "fre-fr", "fra-fr",
                  "fre-ca", "fra-ca", "quebec", "québec"
              },
              "italian": {"it", "ita", "italian", "italiano", "it-it", "it-ch", "ita-it"},
              "german": {"de", "ger", "deu", "german", "deutsch", "de-de", "de-at", "de-ch", "ger-de", "deu-de"},
          }

          CANON_DISPLAY_NAME = {
              "english": ("eng", "English"),
              "telugu": ("tel", "Telugu"),
              "hindi": ("hin", "Hindi"),
              "tamil": ("tam", "Tamil"),
              "malayalam": ("mal", "Malayalam"),
              "kannada": ("kan", "Kannada"),
              "thai": ("tha", "Thai"),
              "japanese": ("jpn", "Japanese"),
              "korean": ("kor", "Korean"),
              "spanish": ("spa", "Spanish"),
              "french": ("fre", "French"),
              "italian": ("ita", "Italian"),
              "german": ("ger", "German"),
              "unknown": ("und", "Unknown"),
          }

          ALLOWED_AUDIO_LANGS = set()
          for _lang_set in CANONICAL_AUDIO_LANGS.values():
              ALLOWED_AUDIO_LANGS.update(_lang_set)

          # Strictly codecs natively hardware-decoded by Samsung UA55NU7470 (Tizen 4.0 tizen-avplay)
          SAMSUNG_COMPATIBLE_CODECS = {"eac3", "ac3", "aac", "mp3"}
          ALLOWED_SUB_LANGS = {"en", "eng", "english"}
          ALLOWED_TEXT_SUB_CODECS = {"subrip", "srt", "ass", "ssa", "mov_text", "webvtt", "text", "ttml"}

          COMMENTARY_RE = re.compile(
              r"\b(commentary|commentaries|director'?s\s*comment|cast\s*comment|crew\s*comment|"
              r"audio\s*description|descriptive\s*audio|visually\s*impaired|sdh\s*audio)\b",
              re.IGNORECASE
          )
          SDH_SUB_RE = re.compile(r"\b(sdh|hearing\s*impaired|cc|closed\s*caption|hi)\b", re.IGNORECASE)
          FORCED_SUB_RE = re.compile(r"\b(forced|foreign\s*parts|signs\s*(?:&|and)?\s*songs)\b", re.IGNORECASE)
          ASS_TAG_RE = re.compile(r"\{\\[^}]*\}")

          def get_tags(stream: dict) -> dict:
              raw_tags = stream.get("tags") or {}
              return {str(k).lower(): str(v).strip() for k, v in raw_tags.items()}

          def normalize_lang_tokens(lang_str: str) -> set:
              if not lang_str:
                  return set()
              low = lang_str.strip().lower()
              if low in {"und", "unk", "unknown", "zxx", "mis", "mul", "none", "n/a"}:
                  return set()
              primary = re.split(r"[-_\s(]", low)[0]
              return {low, primary}

          def is_commentary_audio(stream: dict, tags: dict) -> bool:
              disp = stream.get("disposition") or {}
              if (
                  disp.get("comment", 0) == 1
                  or disp.get("visual_impaired", 0) == 1
                  or disp.get("descriptions", 0) == 1
              ):
                  return True
              title = tags.get("title", "")
              if title and COMMENTARY_RE.search(title):
                  return True
              return False

          def get_canon_lang(lang_tokens: set) -> str:
              for canon_lang, variations in CANONICAL_AUDIO_LANGS.items():
                  if lang_tokens & variations:
                      return canon_lang
              return "unknown"

          def rank_score(stream: dict) -> int:
              codec = (stream.get("codec_name") or "").lower()
              profile = (stream.get("profile") or "").lower()
              channels = int(stream.get("channels") or 2)
              tags = get_tags(stream)
              bit_rate_raw = stream.get("bit_rate") or tags.get("bps") or tags.get("bps-eng") or 0
              try:
                  bit_rate = int(bit_rate_raw)
              except ValueError:
                  bit_rate = 0

              score = 0
              if "truehd" in codec or "dts-hd" in codec or "dts-hd" in profile or "ma" in profile:
                  score += 100_000_000
              elif "dts" in codec or "dca" in codec or "pcm" in codec or "flac" in codec:
                  score += 60_000_000
              elif codec == "eac3":
                  score += 40_000_000
              elif codec == "ac3":
                  score += 30_000_000
              elif codec in {"aac", "opus"}:
                  score += 20_000_000

              score += channels * 1_000_000
              score += bit_rate
              return score

          def derive_resolution(width: int, height: int) -> str:
              if width >= 3200 or height >= 1600:
                  return "2160p"
              if width >= 2200 or height >= 1200:
                  return "1440p"
              if width >= 1440 or height >= 800:
                  return "1080p"
              if width >= 960 or height >= 500:
                  return "720p"
              return "480p"

          def detect_hdr_format(vstream: dict, orig_name: str) -> str:
              side_data = vstream.get("side_data_list") or []
              has_dovi = any("dovi" in str(sd.get("side_data_type", "")).lower() for sd in side_data)
              has_hdr10plus = any("2094-40" in str(sd.get("side_data_type", "")).lower() or "hdr10+" in str(sd).lower() for sd in side_data)
              transfer = (vstream.get("color_transfer") or "").lower()
              primaries = (vstream.get("color_primaries") or "").lower()

              if not has_hdr10plus and re.search(r"(?i)\bhdr10(?:\+|plus)\b", orig_name):
                  has_hdr10plus = True

              if has_dovi:
                  return "DV+HDR10" if transfer == "smpte2084" else "DV"
              if has_hdr10plus:
                  return "HDR10+"
              if transfer == "smpte2084" or (primaries == "bt2020" and "10" in (vstream.get("pix_fmt") or "")):
                  return "HDR10"
              if transfer == "arib-std-b67":
                  return "HLG"
              return "SDR"

          def detect_x26x_sei(vstream: dict, fmt: dict) -> bool:
              blobs = [json.dumps(vstream.get("tags") or {}), json.dumps((fmt or {}).get("tags") or {})]
              combined = " ".join(blobs).lower()
              return bool(re.search(r"\b(x264|x265|crf=|aq-mode=|psy-rd=)\b", combined))

          def parse_release_metadata(orig_name: str, res_label: str, v_bitrate_mbps: float, has_x26x: bool):
              stem = os.path.splitext(orig_name)[0]

              # 1. Season & Episode detection
              s_num, e_num = 0, 0
              media_type = "movie"
              m_ep = re.search(r"(?i)\bS(\d{1,4})[._\s-]*E(\d{1,4})\b", stem)
              if m_ep:
                  media_type = "series"
                  s_num = int(m_ep.group(1))
                  e_num = int(m_ep.group(2))
              if SEASON_OVR.isdigit():
                  media_type = "series"
                  s_num = int(SEASON_OVR)
              if EPISODE_OVR.isdigit():
                  media_type = "series"
                  e_num = int(EPISODE_OVR)

              # 2. Edition detection
              edition = EDITION_OVR if EDITION_OVR else None
              if not edition:
                  if re.search(r"(?i)\bimax(?:[._\s-]enhanced)?\b", stem):
                      edition = "IMAX"
                  elif re.search(r"(?i)\b(extended|uncut|unrated)\b", stem):
                      edition = "Extended"
                  elif re.search(r"(?i)\bdirector'?s[._\s-]*cut\b", stem):
                      edition = "Director's Cut"
                  elif re.search(r"(?i)\btheatrical\b", stem):
                      edition = "Theatrical"

              # 3. Release Group detection
              m_grp = re.search(r"-([A-Za-z0-9_]+)(?:\.[A-Za-z0-9]+)?$", stem)
              release_group = m_grp.group(1) if m_grp else None

              # 4. Quality Source detection + Bitstream Sanity Gate
              if QUALITY_OVR and QUALITY_OVR.lower() != "auto":
                  claimed_source = QUALITY_OVR
              elif re.search(r"(?i)\bremux\b", stem):
                  claimed_source = "BluRay REMUX"
              elif re.search(r"(?i)\b(bluray|blu-ray|bdrip|brrip|uhd\.bluray)\b", stem):
                  claimed_source = "BluRay"
              elif re.search(r"(?i)\b(web-dl|webdl)\b", stem):
                  claimed_source = "WEB-DL"
              elif re.search(r"(?i)\b(webrip|web-rip|web)\b", stem):
                  claimed_source = "WEBRip"
              else:
                  if not has_x26x and ((res_label == "2160p" and v_bitrate_mbps >= 35.0) or (res_label == "1080p" and v_bitrate_mbps >= 18.0)):
                      claimed_source = "BluRay REMUX"
                  else:
                      claimed_source = "WEB-DL"

              # Enforce Sanity Gate so an encode or WEB-DL is never mislabeled as BluRay REMUX
              if claimed_source == "BluRay REMUX":
                  if has_x26x:
                      print("  🛡️ Sanity Gate: Detected x264/x265 encoder signature -> Reclassifying 'BluRay REMUX' to 'BluRay'.")
                      claimed_source = "BluRay"
                  elif res_label == "2160p" and v_bitrate_mbps < 30.0:
                      print(f"  🛡️ Sanity Gate: 2160p video bitrate ({v_bitrate_mbps:.1f} Mbps) < 30 Mbps floor -> Reclassifying to 'WEB-DL'.")
                      claimed_source = "WEB-DL"
                  elif res_label == "1080p" and v_bitrate_mbps < 14.0:
                      print(f"  🛡️ Sanity Gate: 1080p video bitrate ({v_bitrate_mbps:.1f} Mbps) < 14 Mbps floor -> Reclassifying to 'BluRay'.")
                      claimed_source = "BluRay"

              return media_type, s_num, e_num, claimed_source, edition, release_group

          def compute_fast_content_hash(fpath: str) -> str:
              fsize = os.path.getsize(fpath)
              h = hashlib.blake2b(digest_size=6)
              h.update(str(fsize).encode("utf-8"))
              sample_sz = 16 * MB
              with open(fpath, "rb") as f:
                  if fsize <= sample_sz * 3:
                      h.update(f.read())
                  else:
                      h.update(f.read(sample_sz))
                      f.seek(fsize // 2 - sample_sz // 2)
                      h.update(f.read(sample_sz))
                      f.seek(max(0, fsize - sample_sz))
                      h.update(f.read(sample_sz))
              return h.hexdigest()[:10]

          # 2. Parallel ffprobe across all discovered episodes/files (with -show_format)
          def probe_file(fpath: str):
              probe_cmd = [
                  "ffprobe", "-v", "quiet",
                  "-print_format", "json",
                  "-show_format", "-show_streams", "-show_chapters",
                  fpath
              ]
              try:
                  out = subprocess.check_output(probe_cmd, text=True)
                  return json.loads(out)
              except Exception as e:
                  return {"error": str(e)}

          with ThreadPoolExecutor(max_workers=min(8, len(target_files))) as pool:
              probe_results = list(pool.map(probe_file, target_files))

          # 3. Audit & Remux each media file in chronological order
          HEADER_KEEP = 64 * MB
          FOOTER_KEEP = 64 * MB
          SAFETY_LAG = 512 * MB
          MIN_PUNCH_STEP = 128 * MB

          def get_ffmpeg_min_read_pos(pid: int, target_inode_id: tuple):
              fd_dir = f"/proc/{pid}/fd"
              fdinfo_dir = f"/proc/{pid}/fdinfo"
              positions = []
              try:
                  for fd_name in os.listdir(fd_dir):
                      try:
                          st = os.stat(f"{fd_dir}/{fd_name}")
                          if (st.st_dev, st.st_ino) == target_inode_id:
                              with open(f"{fdinfo_dir}/{fd_name}", "r") as f:
                                  for line in f:
                                      if line.startswith("pos:"):
                                          positions.append(int(line.split()[1]))
                                          break
                      except OSError:
                          continue
              except OSError:
                  pass
              return min(positions) if positions else None

          ingest_manifest = []

          for idx, (target_file, probe_data) in enumerate(zip(target_files, probe_results), 1):
              orig_filename = os.path.basename(target_file)
              orig_size = os.path.getsize(target_file)
              target_stat = os.stat(target_file)
              target_inode_id = (target_stat.st_dev, target_stat.st_ino)
              free_before = shutil.disk_usage(WORKSPACE_DIR).free

              print(f"\n🎬 [{idx}/{len(target_files)}] Inspecting: {orig_filename} ({orig_size / GB:.2f} GiB) | Free Disk: {free_before / GB:.2f} GiB")

              if "error" in probe_data or not probe_data.get("streams"):
                  print(f"❌ ffprobe failed on '{orig_filename}': {probe_data.get('error', 'no streams')}")
                  sys.exit(1)

              streams = probe_data.get("streams", [])
              fmt_info = probe_data.get("format", {})

              video_keep, video_drop = [], []
              audio_all, audio_candidates, audio_drop = [], [], []
              sub_keep, sub_drop = [], []

              for s in streams:
                  ctype = (s.get("codec_type") or "").lower()
                  cname = (s.get("codec_name") or "unknown").lower()
                  disp = s.get("disposition") or {}
                  tags = get_tags(s)
                  lang_raw = tags.get("language", "")
                  title_raw = tags.get("title", "")
                  lang_tokens = normalize_lang_tokens(lang_raw)

                  if ctype == "video":
                      if disp.get("attached_pic", 0) == 1:
                          video_drop.append((s, "attached cover art"))
                      else:
                          video_keep.append(s)
                  elif ctype == "audio":
                      audio_all.append(s)
                      if is_commentary_audio(s, tags):
                          audio_drop.append((s, f"commentary/descriptive ({lang_raw or 'und'}: {title_raw or cname})"))
                      elif not (lang_tokens & ALLOWED_AUDIO_LANGS):
                          reason = "untagged/und" if not lang_tokens else f"disallowed language '{lang_raw}'"
                          audio_drop.append((s, reason))
                      else:
                          audio_candidates.append(s)
                  elif ctype == "subtitle":
                      if not (lang_tokens & ALLOWED_SUB_LANGS):
                          reason = "untagged/und" if not lang_tokens else f"non-English '{lang_raw}'"
                          sub_drop.append((s, reason))
                      elif cname not in ALLOWED_TEXT_SUB_CODECS:
                          sub_drop.append((s, f"non-text/bitmap subtitle codec '{cname}'"))
                      else:
                          sub_keep.append(s)

              if not video_keep and video_drop:
                  video_keep.append(video_drop.pop(0)[0])
              video_keep = [video_keep[0]]  # Strictly keep primary video stream

              if not audio_candidates and audio_all:
                  non_comm = [s for s in audio_all if not is_commentary_audio(s, get_tags(s))]
                  pool = non_comm if non_comm else audio_all
                  fallback_track = next(
                      (s for s in pool if (s.get("disposition") or {}).get("default", 0) == 1),
                      pool[0]
                  )
                  audio_candidates.append(fallback_track)
                  audio_drop = [(s, r) for s, r in audio_drop if s.get("index") != fallback_track.get("index")]
                  print(f"⚠️ Zero audio tracks matched allowed languages; falling back to stream #{fallback_track.get('index')} so output isn't mute.")

              # OPTION A AUDIO PLAN: Group by canonical language, pick ONLY the single highest-scoring track per language,
              # drop redundant tracks in the same language, and transcode in-place to E-AC-3 if not natively compatible.
              lang_buckets = {}
              for s in audio_candidates:
                  l_tokens = normalize_lang_tokens(get_tags(s).get("language", ""))
                  canon_lang = get_canon_lang(l_tokens)
                  lang_buckets.setdefault(canon_lang, []).append(s)

              final_audio_plan = []
              for canon_lang, lang_streams in lang_buckets.items():
                  best_src = max(lang_streams, key=rank_score)
                  for extra_s in lang_streams:
                      if extra_s["index"] != best_src["index"]:
                          audio_drop.append((extra_s, f"redundant lower-tier '{canon_lang}' track (Option A kept #{best_src['index']})"))

                  src_idx = best_src["index"]
                  src_codec = (best_src.get("codec_name") or "unknown").lower()
                  src_ch = int(best_src.get("channels") or 2)
                  iso_code, display_lang = CANON_DISPLAY_NAME.get(canon_lang, ("und", "Unknown"))

                  if src_codec in SAMSUNG_COMPATIBLE_CODECS:
                      out_ch_str = "7.1" if src_ch >= 8 else ("5.1" if src_ch >= 5 else "2.0")
                      out_codec_label = {"eac3": "E-AC-3", "ac3": "AC-3", "aac": "AAC", "mp3": "MP3"}.get(src_codec, src_codec.upper())
                      final_audio_plan.append({
                          "mode": "copy",
                          "src_index": src_idx,
                          "src_codec": src_codec,
                          "out_codec_label": out_codec_label,
                          "out_channels_label": out_ch_str,
                          "iso_lang": iso_code,
                          "display_lang": display_lang,
                          "title": f"{display_lang} ({out_codec_label} {out_ch_str})"
                      })
                      print(f"  ✅ AUDIO [{display_lang}]: Stream #{src_idx} ({src_codec.upper()}, {src_ch}ch) is Tizen-compatible -> Stream Copy")
                  else:
                      target_ac = 6 if src_ch >= 5 else 2
                      target_br = "640k" if src_ch >= 5 else "256k"
                      out_ch_str = "5.1" if target_ac == 6 else "2.0"
                      final_audio_plan.append({
                          "mode": "transcode_eac3",
                          "src_index": src_idx,
                          "src_codec": src_codec,
                          "target_ac": target_ac,
                          "target_br": target_br,
                          "out_codec_label": "E-AC-3",
                          "out_channels_label": out_ch_str,
                          "iso_lang": iso_code,
                          "display_lang": display_lang,
                          "title": f"{display_lang} (E-AC-3 {out_ch_str})"
                      })
                      print(
                          f"  🔄 AUDIO [{display_lang}]: Replacing incompatible stream #{src_idx} ({src_codec.upper()}, {src_ch}ch) "
                          f"in-place with E-AC-3 {out_ch_str} @ {target_br}"
                      )

              for s, reason in audio_drop:
                  t = get_tags(s)
                  print(f"  🗑️ DROP AUDIO #{s.get('index')}: codec={s.get('codec_name')} lang={t.get('language', 'und')} -> {reason}")
              for s in sub_keep:
                  t = get_tags(s)
                  print(f"  📝 EXTRACT SUB #{s.get('index')} -> .srt: codec={s.get('codec_name')} lang={t.get('language', 'und')} title={t.get('title', '-')}")

              # Capture pre-remux bitstream properties from primary video stream
              v0 = video_keep[0]
              width = int(v0.get("width") or 1920)
              height = int(v0.get("height") or 1080)
              res_label = derive_resolution(width, height)
              hdr_format = detect_hdr_format(v0, orig_filename)
              has_x26x_sei = detect_x26x_sei(v0, fmt_info)
              raw_vcodec = (v0.get("codec_name") or "hevc").lower()
              video_codec_label = "HEVC" if raw_vcodec in {"hevc", "h265"} else ("AVC" if raw_vcodec in {"h264", "avc"} else raw_vcodec.upper())
              duration_sec = int(float(fmt_info.get("duration") or v0.get("duration") or 1))

              # Prepare subtitle extraction directory for this media file
              sub_dir = os.path.join(WORKSPACE_DIR, f"subs_{idx}")
              os.makedirs(sub_dir, exist_ok=True)
              extracted_subs_meta = []

              # Always output fast-start .mkv with Cues at the front of the file (-reserve_index_space 512k) and -sn
              stem_clean = os.path.splitext(orig_filename)[0]
              final_mkv_path = os.path.join(os.path.dirname(target_file), f"{stem_clean}.mkv")
              temp_output = os.path.join(os.path.dirname(target_file), f".lean_remux_tmp_{idx}.mkv")

              cmd = [
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-nostdin", "-y",
                  "-i", target_file,
                  "-map_chapters", "-1",
                  "-dn",
                  "-sn",
                  "-map", f"0:{v0['index']}",
              ]

              for plan in final_audio_plan:
                  cmd += ["-map", f"0:{plan['src_index']}"]

              cmd += ["-c:v", "copy"]

              for out_a_idx, plan in enumerate(final_audio_plan):
                  disp_flag = "default" if out_a_idx == 0 else "0"
                  if plan["mode"] == "copy":
                      cmd += [
                          f"-c:a:{out_a_idx}", "copy",
                          f"-metadata:s:a:{out_a_idx}", f"language={plan['iso_lang']}",
                          f"-metadata:s:a:{out_a_idx}", f"title={plan['title']}",
                          f"-disposition:a:{out_a_idx}", disp_flag,
                      ]
                  else:
                      cmd += [
                          f"-c:a:{out_a_idx}", "eac3",
                          f"-ac:a:{out_a_idx}", str(plan["target_ac"]),
                          f"-b:a:{out_a_idx}", plan["target_br"],
                          f"-metadata:s:a:{out_a_idx}", f"language={plan['iso_lang']}",
                          f"-metadata:s:a:{out_a_idx}", f"title={plan['title']}",
                          f"-disposition:a:{out_a_idx}", disp_flag,
                      ]

              cmd += [
                  "-reserve_index_space", "512k",
                  "-max_muxing_queue_size", "9999",
                  temp_output
              ]

              # Single-pass subtitle extraction & conversion to UTF-8 .srt in the exact same ffmpeg command
              for sub_out_idx, s in enumerate(sub_keep):
                  s_tags = get_tags(s)
                  s_disp = s.get("disposition") or {}
                  s_title = s_tags.get("title", "")

                  is_forced = bool(s_disp.get("forced", 0) == 1 or FORCED_SUB_RE.search(s_title))
                  is_sdh = bool(s_disp.get("hearing_impaired", 0) == 1 or SDH_SUB_RE.search(s_title))

                  if is_forced:
                      label = "English [Forced]"
                  elif is_sdh:
                      label = "English [SDH]"
                  elif s_title:
                      label = f"English ({s_title})"
                  else:
                      label = "English [Full]"

                  srt_local_path = os.path.join(sub_dir, f"eng_{sub_out_idx}.srt")
                  cmd += ["-map", f"0:{s['index']}", "-c:s", "srt", srt_local_path]
                  extracted_subs_meta.append({
                      "track_index": sub_out_idx,
                      "lang_code": "eng",
                      "label": label,
                      "is_forced": is_forced,
                      "is_sdh": is_sdh,
                      "local_path": srt_local_path,
                  })

              punch_fd = None
              if linux_fallocate is not None and orig_size > (HEADER_KEEP + FOOTER_KEEP + SAFETY_LAG):
                  try:
                      punch_fd = os.open(target_file, os.O_RDWR)
                  except OSError:
                      punch_fd = None

              print(f"🚀 Starting single-pass fast-start MKV remux + .srt extraction (Hole-Punching: {'ACTIVE' if punch_fd is not None else 'INACTIVE'})...")

              t0 = time.perf_counter()
              proc = subprocess.Popen(cmd, stderr=subprocess.PIPE, text=True)

              punched_up_to = HEADER_KEEP
              total_punched = 0
              next_log_threshold = 10 * GB
              recent_positions = deque(maxlen=15)

              try:
                  while proc.poll() is None:
                      if punch_fd is not None:
                          try:
                              out_sz = os.path.getsize(temp_output) if os.path.exists(temp_output) else 0
                          except OSError:
                              out_sz = 0

                          if out_sz >= 32 * MB:
                              cur_pos = get_ffmpeg_min_read_pos(proc.pid, target_inode_id)
                              if cur_pos is not None and cur_pos >= HEADER_KEEP:
                                  recent_positions.append(cur_pos)
                                  if len(recent_positions) >= 5:
                                      safe_read_pos = min(recent_positions)
                                      raw_limit = min(orig_size - FOOTER_KEEP, safe_read_pos - SAFETY_LAG)
                                      aligned_limit = (raw_limit // MB) * MB
                                      if aligned_limit - punched_up_to >= MIN_PUNCH_STEP:
                                          punch_len = aligned_limit - punched_up_to
                                          try:
                                              linux_fallocate(punch_fd, PUNCH_MODE, punched_up_to, punch_len)
                                              if total_punched == 0:
                                                  print(f"  ⚡ First hole-punch succeeded: deallocated {punch_len / MB:.0f} MiB at offset {punched_up_to / MB:.0f} MiB")
                                              total_punched += punch_len
                                              punched_up_to = aligned_limit
                                              if total_punched >= next_log_threshold:
                                                  free_now = shutil.disk_usage(WORKSPACE_DIR).free
                                                  print(f"  ♻️ Hole-Punched: {total_punched / GB:.2f} GiB | Temp Out: {out_sz / GB:.2f} GiB | Free Disk: {free_now / GB:.2f} GiB")
                                                  next_log_threshold += 10 * GB
                                          except OSError as e:
                                              print(f"  ⚠️ fallocate64 punch failed ({e}); disabling further hole-punching.")
                                              os.close(punch_fd)
                                              punch_fd = None
                      time.sleep(0.01)
              finally:
                  if punch_fd is not None:
                      try:
                          os.close(punch_fd)
                      except OSError:
                          pass

              _, stderr_out = proc.communicate()
              elapsed = max(0.001, time.perf_counter() - t0)

              if proc.returncode != 0 or not os.path.exists(temp_output) or os.path.getsize(temp_output) == 0:
                  print(f"❌ ffmpeg remux failed (exit {proc.returncode}):\n{stderr_out}")
                  sys.exit(1)

              # Remove original input file (if extension was .mp4/.m2ts) and move temp_output to final_mkv_path
              if os.path.exists(target_file) and os.path.realpath(target_file) != os.path.realpath(final_mkv_path):
                  try:
                      os.remove(target_file)
                  except OSError:
                      pass
              os.replace(temp_output, final_mkv_path)

              # Sanitize ASS positioning/override tags from extracted UTF-8 .srt files
              valid_subs = []
              for sm in extracted_subs_meta:
                  spath = sm["local_path"]
                  if os.path.exists(spath) and os.path.getsize(spath) > 0:
                      try:
                          with open(spath, "r", encoding="utf-8", errors="replace") as sf:
                              cleaned_srt = ASS_TAG_RE.sub("", sf.read())
                          with open(spath, "w", encoding="utf-8") as sf:
                              sf.write(cleaned_srt)
                          sm["file_size_bytes"] = os.path.getsize(spath)
                          valid_subs.append(sm)
                      except Exception as e:
                          print(f"  ⚠️ Subtitle sanitization warning on {spath}: {e}")

              new_size = os.path.getsize(final_mkv_path)
              content_hash = compute_fast_content_hash(final_mkv_path)

              # Calculate pure video bitrate in Mbps (subtracting approx audio overhead)
              total_mbps = (new_size * 8.0) / (max(1, duration_sec) * 1_000_000.0)
              audio_mbps_est = len(final_audio_plan) * 0.64
              video_bitrate_mbps = round(max(0.5, total_mbps - audio_mbps_est), 2)

              media_type, s_num, e_num, quality_source, edition, release_group = parse_release_metadata(
                  orig_filename, res_label, video_bitrate_mbps, has_x26x_sei
              )

              primary_audio = final_audio_plan[0]
              audio_langs_list = list(dict.fromkeys(p["display_lang"] for p in final_audio_plan))
              audio_summary = f"{primary_audio['out_codec_label']} {primary_audio['out_channels_label']} ({', '.join(audio_langs_list)})"

              saved_gib = (orig_size - new_size) / GB
              speed_mibs = (new_size / MB) / elapsed
              print(
                  f"✅ Remux complete in {elapsed:.1f}s ({speed_mibs:.1f} MiB/s) | "
                  f"Size: {orig_size / GB:.2f} GiB -> {new_size / GB:.2f} GiB | "
                  f"Verified: {res_label} {quality_source} {hdr_format} ({video_bitrate_mbps} Mbps) | "
                  f"Extracted {len(valid_subs)} .srt track(s) | Hash: {content_hash}"
              )

              ingest_manifest.append({
                  "local_video_path": final_mkv_path,
                  "sub_dir": sub_dir,
                  "content_hash": content_hash,
                  "imdb_id": IMDB_ID,
                  "media_type": media_type,
                  "season": s_num,
                  "episode": e_num,
                  "title": stem_clean,
                  "resolution": res_label,
                  "width": width,
                  "height": height,
                  "quality_source": quality_source,
                  "edition": edition,
                  "release_group": release_group,
                  "video_codec": video_codec_label,
                  "video_bitrate_mbps": video_bitrate_mbps,
                  "has_x26x_sei": has_x26x_sei,
                  "hdr_format": hdr_format,
                  "audio_codec": primary_audio["out_codec_label"],
                  "audio_channels": primary_audio["out_channels_label"],
                  "audio_langs": audio_langs_list,
                  "audio_summary": audio_summary,
                  "file_size_bytes": new_size,
                  "duration_sec": duration_sec,
                  "filename": f"{stem_clean}.mkv",
                  "subtitles": valid_subs,
              })

          with open(os.path.join(WORKSPACE_DIR, "ingest_manifest.json"), "w", encoding="utf-8") as mf:
              json.dump(ingest_manifest, mf, indent=2)
          EOF_BLOAT

          /usr/bin/python3 -u strip_bloat.py
          rm -f strip_bloat.py

      - name: Upload to Hugging Face Bucket & Ingest to Cloudflare D1
        if: env.found == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ secrets.HF_BUCKET }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          cat << 'EOF_HF_UPLOAD' > hf_bucket_uploader.py
          import os
          import sys
          import re
          import json
          import time
          import shutil
          import requests
          from huggingface_hub import batch_bucket_files

          sys.stdout.reconfigure(line_buffering=True)
          sys.stderr.reconfigure(line_buffering=True)

          HF_TOKEN = os.environ.get("HF_TOKEN", "").strip()
          HF_BUCKET = os.environ.get("HF_BUCKET", "").strip().strip("/")
          CF_WORKER_URL = os.environ.get("CF_WORKER_URL", "").strip().rstrip("/")
          INGEST_SECRET = os.environ.get("INGEST_SECRET", "").strip()
          XET_CACHE_DIR = os.environ.get("HF_XET_CACHE", "/tmp/hf_xet_cache")

          if not all([HF_TOKEN, HF_BUCKET, CF_WORKER_URL, INGEST_SECRET]):
              print("❌ Missing one or more required secrets: HF_TOKEN, HF_BUCKET, CF_WORKER_URL, INGEST_SECRET")
              sys.exit(1)

          manifest_path = os.path.join("workspace", "ingest_manifest.json")
          if not os.path.exists(manifest_path):
              print("❌ workspace/ingest_manifest.json not found.")
              sys.exit(1)

          with open(manifest_path, "r", encoding="utf-8") as mf:
              items = json.load(mf)

          MB = 1024 * 1024
          GB = 1024 * MB
          total_items = len(items)
          global_t0 = time.perf_counter()
          total_bytes_uploaded = 0

          def slugify(val: str) -> str:
              return re.sub(r"[^a-z0-9]+", "", val.lower())

          for idx, item in enumerate(items, 1):
              local_video = item["local_video_path"]
              sub_dir = item["sub_dir"]
              fsize = item["file_size_bytes"]
              imdb_id = item["imdb_id"]
              media_type = item["media_type"]
              season = item["season"]
              episode = item["episode"]
              res_slug = slugify(item["resolution"])
              src_slug = slugify(item["quality_source"])
              hdr_slug = slugify(item["hdr_format"])
              c_hash = item["content_hash"]

              version_folder = f"{res_slug}_{src_slug}_{hdr_slug}_{c_hash}"
              if media_type == "series":
                  base_remote_dir = f"series/{imdb_id}/S{season:02d}E{episode:02d}/{version_folder}"
              else:
                  base_remote_dir = f"movies/{imdb_id}/{version_folder}"

              remote_video_path = f"{base_remote_dir}/video.mkv"
              batch_add_list = [(local_video, remote_video_path)]

              subtitles_payload = []
              for sub in item.get("subtitles", []):
                  local_sub = sub["local_path"]
                  remote_sub_path = f"{base_remote_dir}/subs/eng_{sub['track_index']}.srt"
                  batch_add_list.append((local_sub, remote_sub_path))
                  subtitles_payload.append({
                      "track_index": sub["track_index"],
                      "lang_code": sub["lang_code"],
                      "label": sub["label"],
                      "is_forced": sub["is_forced"],
                      "is_sdh": sub["is_sdh"],
                      "hf_bucket": HF_BUCKET,
                      "hf_sub_path": remote_sub_path,
                      "file_size_bytes": sub["file_size_bytes"],
                  })

              print(
                  f"\n🚀 [{idx}/{total_items}] Uploading '{item['filename']}' ({fsize / GB:.2f} GiB) + "
                  f"{len(subtitles_payload)} .srt file(s) -> hf://buckets/{HF_BUCKET}/{base_remote_dir}"
              )

              t0 = time.perf_counter()
              max_upload_attempts = 3
              for attempt in range(1, max_upload_attempts + 1):
                  try:
                      batch_bucket_files(
                          bucket_id=HF_BUCKET,
                          add=batch_add_list,
                          token=HF_TOKEN
                      )
                      break
                  except Exception as e:
                      if attempt == max_upload_attempts:
                          print(f"❌ Hugging Face Bucket upload failed after {max_upload_attempts} attempts: {e}")
                          sys.exit(1)
                      wait_s = 5 * attempt
                      print(f"⚠️ Upload attempt {attempt} interrupted ({e}); retrying in {wait_s}s...")
                      time.sleep(wait_s)

              elapsed = max(0.001, time.perf_counter() - t0)
              speed_mibs = (fsize / MB) / elapsed
              total_bytes_uploaded += fsize
              print(f"⚡ [{idx}/{total_items}] Uploaded to HF Bucket in {elapsed:.1f}s ({speed_mibs:.1f} MiB/s)")

              # Immediately delete the uploaded local video, subtitles, and Xet staging cache to reclaim disk space
              try:
                  os.remove(local_video)
              except OSError:
                  pass
              shutil.rmtree(sub_dir, ignore_errors=True)
              shutil.rmtree(XET_CACHE_DIR, ignore_errors=True)
              free_now = shutil.disk_usage("workspace").free / GB
              print(f"🧹 Reclaimed {fsize / GB:.2f} GiB on runner disk (Free Disk: {free_now:.2f} GiB)")

              # Register metadata & subtitle tracks in Cloudflare D1 via Worker POST /api/ingest
              ingest_body = {
                  "content_hash": c_hash,
                  "imdb_id": imdb_id,
                  "media_type": media_type,
                  "season": season,
                  "episode": episode,
                  "title": item["title"],
                  "width": item["width"],
                  "height": item["height"],
                  "quality_source": item["quality_source"],
                  "edition": item["edition"],
                  "release_group": item["release_group"],
                  "video_codec": item["video_codec"],
                  "video_bitrate_mbps": item["video_bitrate_mbps"],
                  "has_x26x_sei": item["has_x26x_sei"],
                  "hdr_format": item["hdr_format"],
                  "audio_codec": item["audio_codec"],
                  "audio_channels": item["audio_channels"],
                  "audio_langs": item["audio_langs"],
                  "audio_summary": item["audio_summary"],
                  "file_size_bytes": fsize,
                  "duration_sec": item["duration_sec"],
                  "filename": item["filename"],
                  "hf_bucket": HF_BUCKET,
                  "hf_video_path": remote_video_path,
                  "subtitles": subtitles_payload,
              }

              ingest_url = f"{CF_WORKER_URL}/api/ingest"
              for attempt in range(1, 4):
                  try:
                      resp = requests.post(
                          ingest_url,
                          headers={
                              "Authorization": f"Bearer {INGEST_SECRET}",
                              "Content-Type": "application/json"
                          },
                          json=ingest_body,
                          timeout=20
                      )
                      if resp.status_code == 200:
                          res_json = resp.json()
                          print(
                              f"✅ [{idx}/{total_items}] Registered in Cloudflare D1: stream_id='{res_json.get('stream_id')}' | "
                              f"Subtitles={res_json.get('subtitles_registered')}"
                          )
                          break
                      else:
                          print(f"⚠️ Worker /api/ingest returned HTTP {resp.status_code}: {resp.text}")
                          if attempt == 3:
                              sys.exit(1)
                  except Exception as e:
                      print(f"⚠️ Worker /api/ingest request error ({e}) [attempt {attempt}/3]")
                      if attempt == 3:
                          sys.exit(1)
                  time.sleep(3 * attempt)

          total_elapsed = max(0.001, time.perf_counter() - global_t0)
          agg_speed = (total_bytes_uploaded / MB) / total_elapsed
          print(f"\n🎉 All {total_items} file(s) ({total_bytes_uploaded / GB:.2f} GiB) uploaded to HF Bucket & registered in D1 in {total_elapsed:.1f}s ({agg_speed:.1f} MiB/s)!")
          EOF_HF_UPLOAD

          /usr/bin/python3 -u hf_bucket_uploader.py
          rm -rf workspace/ hf_bucket_uploader.py /tmp/hf_xet_cache
